<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passeport élève Sigma F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout : appli élève — barre latérale sur ordinateur, onglets en bas sur téléphone.
   Le monde du sujet : cahier à petits carreaux, bleu stylo, rouge de correction, surligneur. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EBEEF6; --line:#D9DEEA; --ink:#141A2E; --muted:#596178;
  --red:#CF1530; --red-soft:#FCE7EA; --on-red:#FFFFFF;
  --blue:#2146C2; --blue-soft:#E6ECFB;
  --green:#12805A; --green-soft:#E1F3EA; --amber:#9C5A00; --amber-soft:#FFF0D3;
  --hl:#FFE14D; --grid-line:rgba(33,70,194,.09);
  --v-paper:#FDFDFC; --v-grid:#DCE3F2; --v-margin:#EE9AA4; --v-ink:#1E3FAF; --v-title:#C8102E; --v-text:#161B2E; --v-hl:#FFE14D; --v-green:#11825A; --v-muted:#737A90; --v-shade:#CF1530;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(20,26,46,.06),0 6px 18px -10px rgba(20,26,46,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1020; --surface:#161A2D; --surface-2:#1D2238; --line:#2A3152; --ink:#E9ECF6; --muted:#9BA2BD;
  --red:#FF5A6C; --red-soft:#3B1824; --on-red:#1B0509; --blue:#8FA6FF; --blue-soft:#1C2448;
  --green:#4ED39C; --green-soft:#11301F; --amber:#F2B34E; --amber-soft:#33270F; --hl:#E8CC45; --grid-line:rgba(143,166,255,.07);
  --v-paper:#131829; --v-grid:#212843; --v-margin:#6B2635; --v-ink:#9FB2FF; --v-title:#FF6E7E; --v-text:#ECEEF6; --v-hl:#B89A1E; --v-green:#57D9A3; --v-muted:#8E95B0; --v-shade:#FF5A6C;
  --shadow:none;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1020; --surface:#161A2D; --surface-2:#1D2238; --line:#2A3152; --ink:#E9ECF6; --muted:#9BA2BD;
  --red:#FF5A6C; --red-soft:#3B1824; --on-red:#1B0509; --blue:#8FA6FF; --blue-soft:#1C2448;
  --green:#4ED39C; --green-soft:#11301F; --amber:#F2B34E; --amber-soft:#33270F; --hl:#E8CC45; --grid-line:rgba(143,166,255,.07);
  --v-paper:#131829; --v-grid:#212843; --v-margin:#6B2635; --v-ink:#9FB2FF; --v-title:#FF6E7E; --v-text:#ECEEF6; --v-hl:#B89A1E; --v-green:#57D9A3; --v-muted:#8E95B0; --v-shade:#FF5A6C;
  --shadow:none;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:750;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(1.9rem,1.4rem + 2vw,2.6rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.eyebrow{font:700 .72rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.m,.math{font-family:var(--math)}
sup,sub{font-size:.68em;line-height:0}
.vec{position:relative;display:inline-block;padding-top:.32em;line-height:1}
.vec::before{content:"";position:absolute;left:.04em;right:.12em;top:.08em;border-top:.075em solid currentColor}
.vec::after{content:"";position:absolute;right:.04em;top:-.04em;width:.22em;height:.22em;border:solid currentColor;border-width:.075em .075em 0 0;transform:rotate(45deg)}
.bar{text-decoration:overline;text-decoration-thickness:.07em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- bandeau démo ---------- */
.demo{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:center;padding:.45rem 16px;background:var(--ink);color:var(--bg);font-size:.82rem}
.demo select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:.1rem .4rem;margin-left:.35rem}
.demo select option{color:#141A2E}

/* ---------- structure ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100% - 34px)}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem;padding:.6rem 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{width:30px;height:30px}
.top b{font-family:var(--display);font-size:1.1rem;flex:1}
main{padding:1.2rem 16px 7.5rem;max-width:1120px;width:100%;min-width:0;margin:0 auto;outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:.15rem;border:0;background:none;padding:.35rem 0;font-size:.7rem;font-weight:700;color:var(--muted);border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--red)}
.streak{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;font-size:.85rem;padding:.25rem .6rem;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--red);color:var(--on-red);font:800 1rem var(--display)}
@media (min-width:920px){
  .app{grid-template-columns:250px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:1.4rem;position:sticky;top:0;height:100vh;padding:1.4rem 1rem;border-right:1px solid var(--line);background:var(--surface)}
  .top,.tabs{display:none}
  main{padding:2rem 2.2rem 4rem}
}
.brand{display:flex;align-items:center;gap:.7rem}
.brand img{width:40px;height:40px}
.brand b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1}
.brand span{font-size:.8rem;color:var(--muted)}
.side-nav{display:flex;flex-direction:column;gap:.2rem}
.nav-btn{display:flex;align-items:center;gap:.75rem;border:0;background:none;padding:.65rem .8rem;border-radius:12px;font-weight:700;color:var(--muted);text-align:left}
.nav-btn svg{width:22px;height:22px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--red-soft);color:var(--red)}
.side-foot{margin-top:auto;display:grid;gap:.7rem}
.me-btn{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.55rem .7rem;text-align:left}
.me-btn small{display:block;color:var(--muted);font-size:.78rem}

/* ---------- éléments ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:12px;padding:.7rem 1.1rem;background:var(--red);color:var(--on-red);font-weight:700;line-height:1.2;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-blue{background:var(--blue);color:var(--surface)}
.btn-sm{padding:.45rem .8rem;font-size:.88rem;border-radius:10px}
.btn-wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.ai-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:var(--blue)}
.ai-tag svg{width:14px;height:14px}
.hl{background:linear-gradient(transparent 52%,color-mix(in srgb,var(--hl) 70%,transparent) 52% 92%,transparent 92%);padding:0 .1em}
.grid-paper{background-color:var(--surface);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:14px 14px}
.page-head{display:grid;gap:.45rem;margin-bottom:1.4rem}
.page-head p.lead{color:var(--muted);max-width:62ch}
.section-t{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:2rem 0 .8rem}
.ring{--p:0;--c:var(--red);width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";width:72%;height:72%;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring span{grid-area:1/1;font:800 .72rem var(--body);z-index:1}
.bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--red))}
.empty{padding:1.2rem;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* ---------- aujourd'hui ---------- */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}
.hello h1 span{color:var(--red)}
.today-grid{display:grid;gap:1rem;grid-template-columns:1fr}
@media (min-width:760px){.today-grid{grid-template-columns:1.35fr 1fr}.today-grid .mission{grid-row:span 2}}
.mission{position:relative;overflow:hidden;border:2px solid var(--red)}
.mission-head{display:flex;align-items:center;gap:.9rem;margin-bottom:.9rem}
.mission-head .ring{width:58px;height:58px}
.mission h2{font-size:1.45rem}
.steps{list-style:none;margin:0 0 1rem;padding:0;display:grid;gap:.6rem}
.step{display:flex;align-items:center;gap:.85rem;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:.75rem .85rem;text-align:left}
.step:hover{border-color:var(--blue)}
.step .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;font-size:.8rem;color:var(--muted)}
.step.done .tick{background:var(--green);border-color:var(--green);color:var(--surface)}
.step.done .step-t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.step-t{font-weight:700;display:block}
.step small{color:var(--muted)}
.step .go{margin-left:auto;color:var(--muted)}
.step>span:nth-child(2){min-width:0}
.mini-thumb{width:64px;aspect-ratio:16/9;border-radius:8px;flex:none;display:grid;place-items:center;border:1px solid var(--line);color:var(--red)}
.mini-thumb svg{width:18px;height:18px}
.info-card{display:grid;gap:.5rem}
.info-card .when{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.info-card .big{font:800 1.5rem/1 var(--display)}
.countdown{display:flex;gap:.35rem;margin-top:.3rem}
.countdown i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.countdown i.on{background:var(--red)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:.9rem;overflow-x:auto;padding-bottom:.4rem;scroll-snap-type:x mandatory}
.rail>*{scroll-snap-align:start}

/* ---------- vidéos ---------- */
.vgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.vcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);text-align:left;padding:0;box-shadow:var(--shadow)}
.vcard:hover .vthumb .play{transform:scale(1.08)}
.vthumb{position:relative;aspect-ratio:16/9;max-width:100%;padding:.8rem .9rem .8rem 1.4rem;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line)}
.vthumb::before{content:"";position:absolute;left:.75rem;top:0;bottom:0;width:2px;background:var(--v-margin)}
.vthumb .vt{position:relative;font:800 1.15rem/1.1 var(--display);color:var(--ink);max-width:85%}
.vthumb .play{position:absolute;right:.8rem;top:.8rem;width:38px;height:38px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;transition:transform .15s}
.vthumb .play svg{width:16px;height:16px}
.vthumb .dur{position:absolute;right:.7rem;bottom:.6rem;font-size:.75rem;font-weight:700;background:var(--ink);color:var(--bg);padding:.05rem .4rem;border-radius:6px}
.vthumb .seen{position:absolute;left:1.4rem;top:.7rem}
.vmeta{padding:.7rem .9rem .85rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.gen{display:grid;gap:.9rem;border:2px dashed var(--blue);background:var(--blue-soft)}
.gen-row{display:flex;flex-wrap:wrap;gap:.6rem}
.gen-row input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.7rem .9rem}
.toggle{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.92rem}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.how{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:how}
.how div{border-top:2px solid var(--line);padding-top:.7rem}
.how b{display:block;font-family:var(--display);margin-bottom:.15rem}

/* ---------- notions ---------- */
.seg-ctl{display:flex;gap:.3rem;padding:.3rem;background:var(--surface-2);border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto}
.seg-ctl button{border:0;background:none;padding:.5rem .9rem;border-radius:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg-ctl small{font-weight:400;margin-left:.3rem}
.search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.65rem .9rem}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
.chapter-sec{display:grid;gap:.6rem}
.chap-list{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:420px){.chap-list{grid-template-columns:1fr}}
.chap-card h3{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;margin-bottom:.5rem}
.nrow{display:flex;align-items:center;gap:.75rem;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:.65rem 0;text-align:left}
.nrow:first-of-type{border-top:0}
.nrow:hover .nt{color:var(--blue)}
.nrow .ring{width:34px;height:34px}
.nrow .ring span{font-size:.62rem}
.nt{font-weight:700;display:block;line-height:1.25}
.nrow small{color:var(--muted);font-size:.8rem}
.nrow .chip{margin-left:auto}

/* ---------- fiche notion (panneau) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}
.sheet-scrim{position:absolute;inset:0;background:rgba(9,12,24,.45)}
.sheet-panel{position:relative;width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:1.4rem 1.2rem calc(2rem + env(safe-area-inset-bottom,0px));display:grid;align-content:start;gap:1rem;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
@media (max-width:640px){.sheet{align-items:flex-end}.sheet-panel{height:auto;max-height:92%;border-radius:22px 22px 0 0}}
.sheet-x{position:absolute;right:1rem;top:1rem;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.ess{border-left:4px solid var(--green);padding:.8rem 1rem;background:var(--green-soft);border-radius:0 14px 14px 0;font-family:var(--math);font-size:1.12rem;line-height:1.5}
.ex{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;font-family:var(--math);font-size:1.12rem}
.actions{display:grid;gap:.55rem}
.act{display:flex;align-items:center;gap:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.8rem .9rem;text-align:left;width:100%}
.act:hover{border-color:var(--blue)}
.act .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--red-soft);color:var(--red)}
.act .ic.b{background:var(--blue-soft);color:var(--blue)}
.act .ic.g{background:var(--green-soft);color:var(--green)}
.act .ic svg{width:20px;height:20px}
.act b{display:block}
.act small{color:var(--muted)}

/* ---------- réviser ---------- */
.rev-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;align-items:end;height:120px;margin:.6rem 0 .3rem}
.boxes div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.25rem;height:100%}
.boxes i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--blue);min-height:4px}
.boxes span{font-size:.75rem;color:var(--muted)}
.boxes b{font-size:.85rem}
.session{display:grid;gap:1rem;justify-items:center;max-width:640px;margin:0 auto}
.dots{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center}
.dots i{width:22px;height:6px;border-radius:9px;background:var(--surface-2)}
.dots i.ok{background:var(--green)}.dots i.ko{background:var(--red)}.dots i.cur{background:var(--blue)}
.flip{width:100%;perspective:1400px;border:0;background:none;padding:0}
.flip-in{position:relative;display:grid;min-height:260px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);padding:1.6rem 1.4rem 1.6rem 2.4rem;display:grid;align-content:center;gap:.6rem;text-align:left;position:relative;box-shadow:var(--shadow)}
.face::before{content:"";position:absolute;left:1.3rem;top:0;bottom:0;width:2px;background:var(--v-margin)}
.face .q{font:400 1.6rem/1.3 var(--math)}
.face.back{transform:rotateY(180deg)}
.face.back .q{color:var(--blue)}
.face .hint{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%}
.qcm-opts{display:grid;gap:.55rem;width:100%}
.qopt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:.85rem 1rem;text-align:left;font-family:var(--math);font-size:1.15rem}
.qopt:hover:not(:disabled){border-color:var(--blue)}
.qopt.ok{border-color:var(--green);background:var(--green-soft)}
.qopt.ko{border-color:var(--red);background:var(--red-soft)}
.fb{width:100%;padding:.85rem 1rem;border-radius:14px;background:var(--surface-2)}
.result-list{list-style:none;padding:0;margin:0;display:grid;gap:.4rem;width:100%}
.result-list li{display:flex;gap:.6rem;align-items:baseline;padding:.55rem .8rem;border-radius:12px;background:var(--surface)}
.result-list .m{font-size:1.05rem}

/* ---------- progrès ---------- */
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat b{display:block;font:800 1.9rem/1 var(--display);margin:.35rem 0}
.stat small{color:var(--muted)}
.prog-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:1rem}
.heat{max-width:360px;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:.8rem}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--red) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--red) 60%,var(--surface-2))}
.heat i.l3{background:var(--red)}
.chart{width:100%;height:auto;display:block;margin-top:.6rem}
.chart text{font:12px var(--body);fill:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:700}
.mastery-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 42px;gap:.7rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.mastery-row:first-of-type{border-top:0}
.badges{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.badge{display:grid;gap:.25rem;justify-items:center;text-align:center;padding:.9rem .5rem;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.badge .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 1.1rem var(--display);background:var(--amber-soft);color:var(--amber)}
.badge.off{opacity:.45}
.badge small{color:var(--muted);font-size:.75rem;line-height:1.3}

/* ---------- lecteur ---------- */
.player{position:fixed;inset:0;z-index:80;background:rgba(6,8,18,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.pl-wrap{width:min(1180px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;background:var(--bg);border-radius:22px;padding:1rem}
@media (min-width:1000px){.pl-wrap{grid-template-columns:minmax(0,1fr) 270px}}
.pl-top{display:flex;align-items:center;gap:.8rem;grid-column:1/-1}
.pl-top h2{flex:1;font-size:1.2rem}
.pl-close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1}
.pl-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--v-paper)}
.pl-stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.pl-bigplay{position:absolute;inset:0;margin:auto;width:88px;height:88px;border-radius:50%;border:0;background:var(--red);color:var(--on-red);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pl-bigplay svg{width:36px;height:36px;margin-left:5px}
.pl-cap{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);max-width:88%;text-align:center;font-size:clamp(.7rem,1.5vw,1.12rem);line-height:1.35;background:rgba(10,12,24,.82);color:#fff;padding:.35rem .8rem;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.pl-cap.on{opacity:1}
.pl-quiz,.pl-end{position:absolute;left:0;right:0;bottom:0;top:34%;padding:1rem 1.2rem;display:grid;align-content:center;gap:.7rem;background:linear-gradient(transparent,color-mix(in srgb,var(--v-paper) 94%,transparent) 14%)}
.pl-end{top:0;justify-items:center;text-align:center;background:color-mix(in srgb,var(--v-paper) 94%,transparent)}
.pe-t{font:800 1.5rem/1.15 var(--display)}
.pe-xp{font-weight:800;color:var(--green)}
.pe-acts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.pq-q{font:600 1.05rem var(--body)}
.pq-opts{display:grid;gap:.45rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.pq-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem .8rem;font-family:var(--math);font-size:1.08rem;text-align:left}
.pq-opt.ok{border-color:var(--green);background:var(--green-soft)}
.pq-opt.ko{border-color:var(--red);background:var(--red-soft)}
.pq-fb{font-size:.95rem}
.pq-fb .btn{margin-left:.4rem}
.pl-bar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-top:.6rem}
.pl-btn{height:38px;min-width:38px;padding:0 .7rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem}
.pl-btn svg{width:18px;height:18px}
.pl-btn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.pl-play{background:var(--red);color:var(--on-red);border-color:var(--red)}
.pl-segs{flex:1 1 220px;display:flex;gap:3px;height:10px;order:-1;width:100%;flex-basis:100%;margin-bottom:.3rem}
.seg{border:0;padding:0;background:var(--surface-2);border-radius:4px;overflow:hidden;height:100%}
.seg i{display:block;height:100%;background:var(--red)}
.pl-time{font-size:.85rem;color:var(--muted);margin-right:auto}
.pl-chapters ol{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.25rem}
.pl-chapters .chap{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.5rem .55rem;border-radius:10px;text-align:left}
.pl-chapters .chap:hover{background:var(--surface-2)}
.pl-chapters .chap.cur{background:var(--red-soft);color:var(--red)}
.chap-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.75rem;font-weight:800;flex:none}
.chap.done .chap-n{background:var(--green);color:var(--surface)}
.chap-t{flex:1;font-weight:700;font-size:.9rem;line-height:1.25}
.chap-d{font-size:.78rem;color:var(--muted)}
.pl-note{font-size:.8rem;color:var(--muted);margin-top:.8rem}
.pl-vsel{width:100%;margin-top:.35rem;border:1px solid var(--line);border-radius:10px;padding:.45rem .5rem;background:var(--surface);font-size:.85rem}

/* ---------- tuteur ---------- */
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.75rem 1.1rem;background:var(--blue);color:var(--surface);font-weight:700;box-shadow:0 10px 24px -8px rgba(33,70,194,.6)}
.fab svg{width:20px;height:20px}
@media (min-width:920px){.fab{bottom:24px;right:24px}}
.tutor{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;width:min(420px,calc(100% - 32px));height:min(620px,calc(100% - 140px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden}
@media (min-width:920px){.tutor{bottom:24px;right:24px}}
.tutor-head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.tutor-head b{font-family:var(--display);font-size:1.1rem;display:block}
.tutor-head small{color:var(--muted)}
.tutor-log{flex:1;overflow-y:auto;padding:1rem;display:grid;align-content:start;gap:.7rem}
.msg{max-width:88%;padding:.65rem .85rem;border-radius:16px;white-space:pre-wrap;line-height:1.45}
.msg.me{justify-self:end;background:var(--blue);color:var(--surface);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--surface-2);border-bottom-left-radius:4px}
.sugg{display:flex;flex-wrap:wrap;gap:.4rem}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .75rem;font-size:.85rem}
.tutor-form{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--line)}
.tutor-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--bg)}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loader{display:grid;gap:.8rem;justify-items:center;text-align:center;padding:2rem 1rem}
.pencil{width:64px;height:64px;border-radius:50%;border:4px solid var(--blue-soft);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}}
.week{list-style:none;padding:0;margin:0;display:grid;gap:.4rem}
.week li{display:grid;grid-template-columns:64px 1fr;gap:.6rem;align-items:baseline;padding:.5rem .7rem;border-radius:12px;background:var(--surface)}
.week li.today{outline:2px solid var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.switch input{width:44px;height:24px;accent-color:var(--green)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:.7rem;background:var(--surface);min-height:84px}

/* ======================= PASSEPORT ÉLÈVE ======================= */
:root{
  --f-up:#B3202F; --f-up-soft:#F7DDE0; --f-boost:#22397A; --f-boost-soft:#DEE4F2; --f-ob1:#A97B37; --f-ob1-soft:#F3E7D3;
  --f-obt:#1D6343; --f-obt-soft:#DCEBE2; --f-tr:#D9822B; --f-tr-soft:#FBE8D3;
  --eb-cours:#E6ECFB; --eb-cours-ink:#2146C2; --eb-perso:#E1F3EA; --eb-perso-ink:#12805A; --eb-autre:#FFF0D3; --eb-autre-ink:#9C5A00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --f-up:#FF7A87; --f-up-soft:#3B1824; --f-boost:#9DB0F2; --f-boost-soft:#1E2747; --f-ob1:#E3B774; --f-ob1-soft:#33270F;
  --f-obt:#6FD3A1; --f-obt-soft:#12301F; --f-tr:#F2A65A; --f-tr-soft:#3A2410;
  --eb-cours:#1C2448; --eb-cours-ink:#A9BBFF; --eb-perso:#11301F; --eb-perso-ink:#6FD3A1; --eb-autre:#33270F; --eb-autre-ink:#F2B34E;}}
:root[data-theme="dark"]{
  --f-up:#FF7A87; --f-up-soft:#3B1824; --f-boost:#9DB0F2; --f-boost-soft:#1E2747; --f-ob1:#E3B774; --f-ob1-soft:#33270F;
  --f-obt:#6FD3A1; --f-obt-soft:#12301F; --f-tr:#F2A65A; --f-tr-soft:#3A2410;
  --eb-cours:#1C2448; --eb-cours-ink:#A9BBFF; --eb-perso:#11301F; --eb-perso-ink:#6FD3A1; --eb-autre:#33270F; --eb-autre-ink:#F2B34E;}
.fam-sigmaup{--fam:var(--f-up);--fam-soft:var(--f-up-soft)}
.fam-boost{--fam:var(--f-boost);--fam-soft:var(--f-boost-soft)}
.fam-ob1{--fam:var(--f-ob1);--fam-soft:var(--f-ob1-soft)}
.fam-obt{--fam:var(--f-obt);--fam-soft:var(--f-obt-soft)}
.fam-tr{--fam:var(--f-tr);--fam-soft:var(--f-tr-soft)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.small{font-size:.86rem}
.top-gap{margin-top:1rem}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.row-between.wrap{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.linkish{border:0;background:none;padding:0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.page-head h1{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.page-head .ico{font-size:.9em}
.card h2{margin-bottom:.6rem}
.card h3{margin:.9rem 0 .5rem}
.nav-ico{width:24px;text-align:center;font-size:1.1rem;flex:none}
.tabs .tab-ico{font-size:1.2rem;line-height:24px;height:24px}
.tab{color:var(--muted)}
.side-nav{overflow-y:auto}
.nav-btn{font-size:.95rem}

/* bandeau exemple */
.demo b{font-weight:700}

/* entrées */
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem .65rem;color:var(--ink)}
.in:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.in[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.in-sm{margin-top:.35rem;font-size:.86rem;padding:.35rem .55rem}
.in-n{width:5.2rem;text-align:center;font-variant-numeric:tabular-nums}
select.in{padding-right:1.6rem}
textarea.in{min-height:70px}
input.ok{width:22px;height:22px;accent-color:var(--green)}
label{font-size:.86rem;font-weight:700;color:var(--muted);display:grid;gap:.3rem}
.form-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin-top:.6rem}
.form-row>label{flex:0 1 auto}
.form-row>label.grow{flex:1 1 200px}
.form-row .btn{flex:none}

/* sommaire */
.hello{align-items:stretch}
.next-card{display:grid;gap:.15rem;text-align:left;border:2px solid var(--f-up);background:var(--f-up-soft);color:var(--ink);border-radius:var(--r);padding:.9rem 1.1rem;min-width:min(320px,100%)}
.next-card b{font:800 1.35rem/1.1 var(--display);color:var(--f-up)}
.next-card small{color:var(--muted)}
.next-card em{font-style:normal;font-weight:700;font-size:.82rem;color:var(--f-up)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.toc-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:.15rem .9rem;align-items:center;width:100%;height:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--shadow)}
.toc-card:hover{border-color:var(--blue)}
.toc-ico{grid-row:span 2;width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:1.5rem}
.toc-t b{display:block;font-family:var(--display);font-size:1.08rem}
.toc-t small{color:var(--muted);font-size:.85rem;line-height:1.35;display:block}
.toc-s{grid-column:2;font-size:.78rem;font-weight:700;color:var(--blue)}

/* présentation */
.prose{display:grid;gap:.8rem;max-width:72ch}
.obj{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.obj li{display:flex;gap:.7rem;align-items:flex-start}
.obj li span{font-size:1.2rem;line-height:1.3}
.tabs-doc{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.tab-doc{display:grid;gap:.25rem;text-align:left}
.tab-doc span{font-size:1.4rem}
.tab-doc small{color:var(--muted)}

/* tableaux */
.tbl-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;position:relative}
.tbl.notes td:nth-child(8),.tbl.notes td:nth-child(9){min-width:9rem}.tbl.notes td:nth-child(3){min-width:8rem}
.chart{max-width:820px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-bottom:0;white-space:nowrap}
.tbl thead th:first-child{border-radius:10px 0 0 10px}.tbl thead th:last-child{border-radius:0 10px 10px 0}
.tbl tbody th{font-weight:700}
.tbl th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;text-transform:none;letter-spacing:0}
.tbl .c{text-align:center}
.tbl td.strong{font-weight:800}
.tbl td.up{color:var(--green)} .tbl td.down{color:var(--red)}
.tbl tr.tot th,.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.tbl td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 12px)}
.tbl.infos td{word-break:break-word}
.tbl.notes{min-width:860px}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.1rem;line-height:1}
.x:hover{color:var(--red);border-color:var(--red)}
.pending{color:var(--muted);font-size:.84rem;font-style:italic}
.tick{color:var(--green);font-weight:800}

/* tableau de bord */
.dash{display:grid;gap:1rem;grid-template-columns:1fr}
@media (min-width:900px){.dash{grid-template-columns:1.5fr 1fr}}
.kpis{display:grid;gap:1rem;align-content:start}
.kpi{display:grid;gap:.25rem}
.kpi b{font:800 2rem/1 var(--display)}
.kpi b small{font-size:.9rem;color:var(--muted);font-weight:700}
.pa-grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));margin-top:.4rem}
.pa{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:start;padding:.8rem;border-radius:14px;background:var(--fam-soft)}
.pa-dot{width:14px;height:14px;border-radius:4px;background:var(--fam);margin-top:.25rem}
.pa b{font-family:var(--display)}
.pa p{font-size:.88rem}

/* graphique */
.chart{margin:0}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:600 12px var(--body)}
.chart .lb{fill:var(--ink);font:700 12px var(--body)}
.chart .rng{stroke:var(--surface-2);stroke-width:10;stroke-linecap:round}
.chart .ln-cl{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5}
.chart .ln-me{fill:none;stroke:var(--blue);stroke-width:3}
.chart .pt-me{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:0}
.lg-me{background:var(--blue)} .lg-cl{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)} .lg-rg{background:var(--surface-2);border:1px solid var(--line)}

/* calendrier annuel */
.cal-leg span i{background:var(--fam,var(--muted))}
.cal-leg .today-i{background:transparent;border:2px solid var(--ink)}
.cal-grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));margin-top:.8rem}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem}
.cal-t{font:750 1rem var(--display);text-align:center;margin-bottom:.5rem}
.cal-h,.cal-d{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-h span{font-size:.7rem;font-weight:700;color:var(--muted)}
.cd{aspect-ratio:1;display:grid;place-items:center;font-size:.8rem;border-radius:8px;border:0;background:var(--surface-2);color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.cd.we{color:var(--muted);background:transparent}
.cd.on{background:var(--fam-soft);color:var(--fam);font-weight:800;box-shadow:inset 0 -3px 0 var(--fam)}
.cd.on.past{opacity:.7}
.cd.today{outline:2px solid var(--ink);outline-offset:-2px}
.sess{border-left:6px solid var(--fam)}
.sess h3{margin:.2rem 0}

/* liste des séances */
.act-sec{border-top:5px solid var(--fam);margin-bottom:1rem}
.sl{list-style:none;margin:.8rem 0 0;padding:0;display:grid}
.sl li{display:grid;grid-template-columns:2.6rem 7.2rem 1fr auto;gap:.6rem;align-items:start;padding:.55rem 0;border-top:1px solid var(--line)}
.sl li.past{color:var(--muted)}
.sl li.next{background:var(--fam-soft);border-radius:10px;padding-inline:.4rem;margin-inline:-.4rem}
.sl-n{font-weight:800;color:var(--fam)}
.sl-d small,.sl-t small{display:block;font-size:.8rem;color:var(--muted)}
.sl-t small.ev{color:var(--fam);font-weight:700}
@media (max-width:560px){.sl li{grid-template-columns:2.4rem 1fr auto}.sl-t{grid-column:2/-1}}

/* emploi du temps */
.weeknav{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.legend .eb-cours{background:var(--eb-cours-ink)} .legend .eb-perso{background:var(--eb-perso-ink)} .legend .eb-autre{background:var(--eb-autre-ink)} .legend .eb-sigma{background:var(--f-up)}
.edt-wrap{overflow-x:auto;margin-top:.8rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.edt{display:grid;grid-template-columns:3rem repeat(7,minmax(96px,1fr));min-width:760px;position:relative;padding:.5rem .5rem .8rem 0}
.edt-hours{position:relative;margin-top:2.2rem}
.edt-hours span{position:absolute;right:.4rem;transform:translateY(-50%);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.edt-col{border-left:1px solid var(--line)}
.edt-col.today .edt-day{color:var(--red)}
.edt-day{height:2.2rem;display:flex;align-items:center;justify-content:center;gap:.25rem;font-size:.82rem;color:var(--muted)}
.edt-day b{font-size:1rem;color:inherit}
.edt-body{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--px)}
.eb{position:absolute;left:3px;right:3px;border-radius:8px;padding:.2rem .35rem;overflow:hidden;font-size:.74rem;line-height:1.2;display:grid;align-content:start;cursor:default}
.eb b{font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.eb small{opacity:.85}
.eb-cours{background:var(--eb-cours);color:var(--eb-cours-ink)} .eb-perso{background:var(--eb-perso);color:var(--eb-perso-ink)} .eb-autre{background:var(--eb-autre);color:var(--eb-autre-ink)}
.eb-sigma{background:var(--f-up);color:#fff;z-index:2}
.eb[data-edt-del]{cursor:pointer}
.eb[data-edt-del]:hover{outline:2px solid currentColor}

/* ressources */
.read-first{display:flex;align-items:center;gap:.9rem;text-decoration:none;color:var(--ink);margin-bottom:1rem;border-left:5px solid var(--blue)}
.read-first>span:first-child{font-size:1.6rem}
.read-first b{display:block;font-family:var(--display);font-size:1.1rem}
.read-first>span:last-child{margin-left:auto;color:var(--blue);font-weight:800}
.mx-ch{margin-bottom:1.6rem}
.mx-ch>h2{margin-bottom:.7rem}
.mx-list{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.mx{display:grid;gap:.55rem;align-content:start}
.mx-h{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.mx-h h3{margin:0}
.mx-e{font-family:var(--math);font-size:1.04rem;line-height:1.5;border-left:3px solid var(--green);padding-left:.7rem}
.mx-x{font-family:var(--math);color:var(--muted)}
.mx-x .eyebrow{font-family:var(--body);margin-right:.3rem}
.mx-acts{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.lnks{display:grid;gap:.25rem}
.lnk{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;word-break:break-word}
.lnk-off{color:var(--muted);font-size:.86rem;word-break:break-word}
.mx-acts .lnk{font-size:.86rem;background:var(--surface-2);text-decoration:none;padding:.4rem .7rem;border-radius:10px}
.mx-acts .lnk-ex{color:var(--green)}
.tbl.res{min-width:900px}.tbl.caps{min-width:860px}.tbl.ds{min-width:640px}
.go-far{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.gf{display:grid;gap:.2rem;text-decoration:none;color:var(--ink)}
.gf small{color:var(--muted)}
.gf span{color:var(--blue);font-weight:800}

/* suivi par action */
.tbl.sa{min-width:820px;margin-top:.6rem}
.sa-foot{display:flex;flex-wrap:wrap;gap:1.6rem;margin-top:.9rem}
.sa-foot p{display:grid;gap:.15rem}
.sa-foot b{font:800 1.3rem var(--display)}
.sa-txt{display:grid;gap:.7rem;margin-top:.9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.sa-txt p{display:grid;gap:.25rem;background:var(--surface-2);border-radius:12px;padding:.7rem .8rem}

/* projection bac */
.bac-top{display:grid;gap:1rem;grid-template-columns:1fr}
@media (min-width:1560px){.bac-top{grid-template-columns:1fr 1.4fr}}
.tbl.bac td{vertical-align:middle}
.tbl.bac.cc{min-width:560px}
.bac-res{display:grid;gap:1.2rem;grid-template-columns:1fr;border:2px solid var(--blue)}
@media (min-width:820px){.bac-res{grid-template-columns:1fr 1.3fr}}
.res-main{display:grid;gap:.3rem;align-content:start}
.big{font:800 3rem/1 var(--display)}
.big small{font-size:1.1rem;color:var(--muted)}
.verdict{font-weight:800;font-size:1.05rem}
.verdict.ok{color:var(--green)}.verdict.mid{color:var(--amber)}.verdict.ko{color:var(--red)}
.res-seuils tr.done th,.res-seuils tr.done td{color:var(--green)}
.proj-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin-top:.6rem}
.proj{display:grid;gap:.6rem;align-content:start}
.proj h3{margin:0}
.retenu{display:flex;flex-direction:row;align-items:center;gap:.35rem;font-size:.82rem}
.retenu input{accent-color:var(--blue)}
.proj-out{border-top:1px solid var(--line);padding-top:.6rem}
.proj-out b{font:800 1.5rem var(--display)}

/* entretien */
.en{display:grid;gap:.8rem}
.en h2{margin-bottom:0}
.en h3{margin:.4rem 0 0}
.quote{font-style:italic;color:var(--muted);border-left:3px solid var(--line);padding-left:.8rem}
.lab{display:grid;gap:.35rem;font-weight:700;color:var(--ink);font-size:.95rem}
.lab>span{font-weight:700}
.lab small{font-weight:400}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{display:inline-flex;font-size:.88rem;color:var(--ink)}
.pill input{position:absolute;opacity:0;width:1px;height:1px}
.pill span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .8rem;font-weight:700;cursor:pointer}
.pill input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.pill input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.pills.sm .pill span{padding:.25rem .6rem;font-size:.8rem}
.en-proj{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.en-proj>div{display:grid;gap:.2rem;background:var(--surface-2);border-radius:12px;padding:.7rem .8rem;border:2px solid transparent}
.en-proj>div.on{border-color:var(--blue)}
.en-proj b{font:800 1.4rem var(--display)}
.en-proj small{font-size:.8rem;color:var(--muted)}
.constats{display:grid;gap:.5rem}
.cst{border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem}
.cst.on{border-color:var(--amber);background:var(--amber-soft)}
.cst-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;align-items:center}
.sol{margin-top:.45rem;font-size:.92rem}

/* profil / feuille */
.kv-list{display:grid;gap:.4rem;margin:0}
.kv-list div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding:.4rem 0}
.kv-list dt{color:var(--muted)} .kv-list dd{margin:0;font-weight:700;text-align:right}
.card.soft{background:var(--surface-2);box-shadow:none;display:grid;gap:.5rem}
.card.soft h3{margin:0}
.plus-list{display:grid;gap:.2rem}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:920px){.toast{bottom:2rem}}
@media print{.side,.tabs,.top,.demo,.fab{display:none!important}.app{display:block}main{padding:0}}
/* cartes vidéo : la durée passe en haut pour ne jamais chevaucher le titre */
.vthumb .dur{top:.85rem;bottom:auto;left:1.4rem;right:auto}
.vthumb .seen{left:4.6rem;top:.8rem}
.vthumb .vt{max-width:100%;overflow-wrap:anywhere}
.vmeta .chip{white-space:normal;max-width:100%}
@media (max-width:560px){
  .seg-ctl{flex-wrap:wrap;width:auto}
  .seg-ctl button{padding:.45rem .65rem;font-size:.88rem}
  .in-n{width:3.9rem}
  .tbl th,.tbl td{padding:.45rem .4rem}
}

/* ---------- écran de connexion ---------- */
.login{position:fixed;inset:0;z-index:200;overflow:auto;display:grid;place-items:center;padding:24px 16px;
  background:var(--bg);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:22px 22px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login-card img{width:56px;height:56px}
.login-card h1{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
.login-card p{margin:0;color:var(--muted);line-height:1.5}
.login-card label{font-weight:700;color:var(--ink)}
.login-card .in{font-size:1.25rem;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:.7rem}
.login-card .btn{width:100%}
.login-err{min-height:1.3em;color:var(--red);font-size:.92rem}
.login-demo{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font:inherit;align-self:center;cursor:pointer}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <img id="login-logo" alt="Sigma F">
    <h1>Passeport élève Sigma F</h1>
    <p>Entre le code personnel à 8 caractères que Sigma F t'a envoyé.</p>
    <label for="login-code">Ton code</label>
    <input class="in" id="login-code" name="code" maxlength="12" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD2345" required>
    <div class="login-err" id="login-err" role="alert"></div>
    <button class="btn" type="submit">Se connecter</button>
    <button class="login-demo" type="button" id="login-demo">Voir un exemple de passeport</button>
  </form>
</div>

  ]},
  "n2-equations": { notion: "n2-equations", title: "Équations et inéquations", scenes: [
    { type: "title", title: "Équations et inéquations", sub: "Seconde · Nombres et calculs", say: "Résoudre, c'est isoler x. Une seule règle change pour les inéquations, et c'est elle qui fait perdre des points." },
    { type: "steps", heading: "Résoudre 3x − 7 = 2x + 5", lines: ["3x − 2x = 5 + 7", "x = 12", "vérification : 3 × 12 − 7 = 29 et 2 × 12 + 5 = 29"], say: "On regroupe les x d'un côté et les nombres de l'autre : trois x moins deux x égale cinq plus sept, donc x égale douze. Et on vérifie : les deux membres valent vingt-neuf." },
    { type: "say", heading: "La règle des inéquations", lines: ["Ajouter ou retirer : le sens ne change pas", "Multiplier ou diviser par un positif : non plus", "Par un négatif : le sens change !"], hl: 2, say: "Pour une inéquation, on fait pareil, sauf une chose : si tu multiplies ou divises par un nombre négatif, le sens de l'inégalité s'inverse." },
    { type: "steps", heading: "Résoudre −2x + 4 > 10", lines: ["−2x > 6", "x < 6/(−2)", "x < −3"], say: "Moins deux x plus quatre strictement supérieur à dix. On retire quatre : moins deux x supérieur à six. On divise par moins deux, qui est négatif, donc le sens change : x strictement inférieur à moins trois." },
    { type: "numberline", heading: "L'ensemble des solutions", intervals: [{ from: "-inf", to: -3, left: "open", right: "open" }], ticks: [-3, 0], label: "S = ]−∞ ; −3[", say: "Les solutions forment un intervalle : de moins l'infini à moins trois, avec moins trois exclu, puisque l'inégalité est stricte." },
    { type: "quiz", q: "−5x ≤ 15 équivaut à :", options: ["x ≥ −3", "x ≤ −3", "x ≥ 3", "x ≤ 3"], answer: 0, explain: "On divise par −5 < 0 : le sens de l'inégalité change.", say: "À toi : moins cinq x inférieur ou égal à quinze, ça équivaut à quoi ?" },
    { type: "recap", points: ["On isole x étape par étape", "Diviser par un négatif : le sens s'inverse", "On donne la réponse avec un intervalle"], say: "À retenir : isoler x, retourner l'inégalité quand on divise par un négatif, et écrire la réponse avec un intervalle." },
  ]},
  "n2-signe-produit": { notion: "n2-signe-produit", title: "Le signe d'un produit", scenes: [
    { type: "title", title: "Le tableau de signes", sub: "Seconde · Nombres et calculs", say: "Quand un produit est-il positif ? Plutôt que de développer, on étudie chaque facteur. Le tableau de signes fait tout le travail." },
    { type: "say", heading: "La règle des signes", lines: ["(+) × (+) = +", "(−) × (−) = +", "(+) × (−) = −"], hl: 1, say: "Un produit est positif quand ses deux facteurs ont le même signe, et négatif quand ils ont des signes contraires." },
    { type: "steps", heading: "Le signe de chaque facteur", lines: ["x − 1 > 0 ⟺ x > 1", "x + 2 > 0 ⟺ x > −2", "chaque facteur change de signe en sa racine"], say: "Étudions x moins un, fois x plus deux. x moins un est positif quand x dépasse un. x plus deux est positif quand x dépasse moins deux." },
    { type: "graph", heading: "Ce que dit la courbe", xmin: -4, xmax: 3, ymin: -3, ymax: 5, curves: [{ fn: "(x-1)*(x+2)", label: "y = (x − 1)(x + 2)" }], shade: { fn: "(x-1)*(x+2)", from: -2, to: 1 }, points: [{ x: -2, y: 0, label: "−2" }, { x: 1, y: 0, label: "1" }], say: "Entre moins deux et un, les deux facteurs sont de signes contraires : le produit est négatif, et la courbe passe sous l'axe. Ailleurs, il est positif." },
    { type: "numberline", heading: "La réponse", intervals: [{ from: -2, to: 1, left: "open", right: "open" }], ticks: [-2, 0, 1], label: "(x − 1)(x + 2) < 0 ⟺ x ∈ ]−2 ; 1[", say: "Donc le produit est strictement négatif pour x entre moins deux et un, bornes exclues." },
    { type: "quiz", q: "(x − 3)(x + 1) ≥ 0 pour :", options: ["x ≤ −1 ou x ≥ 3", "−1 ≤ x ≤ 3", "x ≥ 3", "x ≥ −1"], answer: 0, explain: "Les deux facteurs ont le même signe à l'extérieur de −1 et 3, bornes incluses.", say: "À toi : quand est-ce que x moins trois, fois x plus un, est positif ou nul ?" },
    { type: "recap", points: ["Un facteur à la fois : sa racine, son signe", "Même signe : produit positif", "Signes contraires : produit négatif"], say: "À retenir : on étudie chaque facteur séparément, puis la règle des signes donne le signe du produit." },
  ]},
  "n2-lecture": { notion: "n2-lecture", title: "Lire un graphique", scenes: [
    { type: "title", title: "Lire un graphique", sub: "Seconde · Fonctions", say: "Une courbe contient toutes les réponses : images, antécédents, équations. Encore faut-il savoir où regarder." },
    { type: "graph", heading: "Lire une image", xmin: -3, xmax: 5, ymin: -3, ymax: 4, curves: [{ fn: "0.5*x^2-x-1.5", label: "courbe de f" }], points: [{ x: 4, y: 2.5, label: "(4 ; 2,5)" }], say: "Pour lire f de quatre, on part de quatre sur l'axe des abscisses, on monte jusqu'à la courbe, puis on lit la hauteur : deux virgule cinq. Donc f de quatre égale deux virgule cinq." },
    { type: "graph", heading: "Résoudre f(x) = 2,5", xmin: -3, xmax: 5, ymin: -3, ymax: 4, curves: [{ fn: "0.5*x^2-x-1.5" }], hline: 2.5, points: [{ x: -2, y: 2.5, label: "−2" }, { x: 4, y: 2.5, label: "4" }], say: "Pour résoudre f de x égale deux virgule cinq, on trace la droite horizontale à cette hauteur, et on lit les abscisses des points d'intersection : moins deux et quatre. Deux solutions." },
    { type: "graph", heading: "Résoudre f(x) < 0", xmin: -3, xmax: 5, ymin: -3, ymax: 4, curves: [{ fn: "0.5*x^2-x-1.5" }], shade: { fn: "0.5*x^2-x-1.5", from: -1, to: 3 }, points: [{ x: -1, y: 0, label: "−1" }, { x: 3, y: 0, label: "3" }], say: "Et pour f de x strictement négatif, on cherche où la courbe est sous l'axe des abscisses : entre moins un et trois, bornes exclues." },
    { type: "say", heading: "Le bon sens de lecture", lines: ["Image f(a) : on part de l'axe des abscisses", "Antécédent : on part de l'axe des ordonnées", "f(x) = k : les abscisses à la hauteur k"], hl: 2, say: "Retiens le sens de lecture : pour une image, on part de l'axe des abscisses. Pour un antécédent, on part de l'axe des ordonnées." },
    { type: "quiz", q: "La courbe de f passe par le point (−1 ; 4). Alors :", options: ["f(−1) = 4", "f(4) = −1", "−1 est l'image de 4", "f(0) = 4"], answer: 0, explain: "Un point (a ; b) de la courbe signifie que f(a) = b.", say: "À toi : la courbe passe par le point moins un, quatre. Qu'est-ce qu'on peut écrire ?" },
    { type: "recap", points: ["Point (a ; b) sur la courbe : f(a) = b", "f(x) = k : abscisses des points à la hauteur k", "f(x) < 0 : là où la courbe est sous l'axe"], say: "À retenir : chaque point de la courbe se lit a, f de a. Les équations se lisent à l'horizontale, et les signes par rapport à l'axe." },
  ]},
  "n2-variations": { notion: "n2-variations", title: "Variations d'une fonction", scenes: [
    { type: "title", title: "Variations et extremums", sub: "Seconde · Fonctions", say: "Une fonction qui monte, qui descend, qui atteint un sommet. Le tableau de variations résume tout ça en une ligne." },
    { type: "graph", heading: "Croissante, décroissante", xmin: -2.5, xmax: 2.5, ymin: -3, ymax: 3, curves: [{ fn: "x^3-3*x", label: "courbe de f" }], points: [{ x: -1, y: 2, label: "max (−1 ; 2)" }, { x: 1, y: -2, label: "min (1 ; −2)" }], say: "Lis la courbe de gauche à droite, comme un randonneur. Jusqu'à moins un, ça monte : f est croissante. De moins un à un, ça descend : f est décroissante. Puis ça remonte." },
    { type: "say", heading: "La définition", lines: ["f croissante : si a < b, alors f(a) ≤ f(b)", "f décroissante : si a < b, alors f(a) ≥ f(b)"], hl: 0, say: "Croissante veut dire que l'ordre est conservé : si a est plus petit que b, f de a est plus petit que f de b. Décroissante : l'ordre est inversé." },
    { type: "say", heading: "Les variations en résumé", lines: ["sur [−2 ; −1] : f croît de −2 à 2", "sur [−1 ; 1] : f décroît de 2 à −2", "sur [1 ; 2] : f croît de −2 à 2"], hl: 1, say: "Le tableau de variations résume tout. Sur moins deux, moins un, f monte de moins deux à deux. Sur moins un, un, elle descend jusqu'à moins deux. Puis elle remonte jusqu'à deux." },
    { type: "say", heading: "Maximum et minimum", lines: ["Maximum local : 2, atteint en x = −1", "Minimum local : −2, atteint en x = 1", "La valeur ≠ l'endroit où elle est atteinte"], hl: 2, say: "Un extremum est une valeur de f, atteinte en un x précis. Ici, le maximum local vaut deux, atteint en moins un. Ne confonds pas la valeur, deux, et l'endroit où elle est atteinte, moins un." },
    { type: "quiz", q: "f est croissante sur [0 ; 5] et f(1) = 4. Alors f(3) est :", options: ["supérieur ou égal à 4", "inférieur ou égal à 4", "égal à 4", "on ne peut pas savoir"], answer: 0, explain: "1 < 3 et f est croissante, donc f(1) ≤ f(3).", say: "À toi : f est croissante sur zéro, cinq, et f de un vaut quatre. Que peux-tu dire de f de trois ?" },
    { type: "recap", points: ["Croissante : l'ordre est conservé", "Le tableau de variations résume la courbe", "Extremum : une valeur de f, atteinte en un x"], say: "À retenir : on lit les variations de gauche à droite, on les résume dans un tableau, et un extremum est une valeur atteinte en un point." },
  ]},
  "n2-reference": { notion: "n2-reference", title: "Les fonctions de référence", scenes: [
    { type: "title", title: "Les fonctions de référence", sub: "Seconde · Fonctions", say: "Carré, inverse, racine carrée, cube : quatre courbes à reconnaître au premier coup d'œil." },
    { type: "graph", heading: "La fonction carré", xmin: -3, xmax: 3, ymin: -1, ymax: 6, curves: [{ fn: "x^2", label: "y = x²" }], say: "La fonction carré : une parabole en forme de U, symétrique par rapport à l'axe des ordonnées. Elle décroît jusqu'à zéro, puis elle croît. Un carré est toujours positif." },
    { type: "graph", heading: "La fonction inverse", xmin: -4, xmax: 4, ymin: -4, ymax: 4, curves: [{ fn: "1/x", label: "y = 1/x" }], say: "La fonction inverse : une hyperbole en deux morceaux. Elle n'est pas définie en zéro, car on ne divise pas par zéro. Elle est décroissante sur chacun de ses deux intervalles." },
    { type: "graph", heading: "Racine carrée et cube", xmin: -2, xmax: 4, ymin: -3, ymax: 3, curves: [{ fn: "sqrt(x)", label: "y = √x" }, { fn: "x^3", label: "y = x³", color: "red" }], say: "La racine carrée n'est définie que pour x positif ou nul, et elle croît doucement. La fonction cube, elle, croît sur tout ℝ, et change de signe en zéro." },
    { type: "say", heading: "Leurs ensembles de définition", lines: ["x² et x³ : définies sur ℝ", "1/x : définie sur ℝ ∖ {0}", "√x : définie sur [0 ; +∞["], hl: 1, say: "À connaître : carré et cube sont définies partout. L'inverse partout sauf en zéro. La racine carrée sur les nombres positifs ou nuls." },
    { type: "quiz", q: "Si 0 < a < b, alors :", options: ["1/a > 1/b", "1/a < 1/b", "1/a = 1/b", "on ne peut pas conclure"], answer: 0, explain: "La fonction inverse est décroissante sur ]0 ; +∞[ : elle inverse l'ordre.", say: "À toi : si a et b sont positifs et que a est plus petit que b, comment se comparent un sur a et un sur b ?" },
    { type: "recap", points: ["Carré : parabole, minimum en 0", "Inverse : hyperbole, interdite en 0", "Racine : x ≥ 0 ; cube : croissante sur ℝ"], say: "À retenir : quatre courbes, quatre formes, et pour chacune son ensemble de définition et son sens de variation." },
  ]},
  "n2-affines": { notion: "n2-affines", title: "Les fonctions affines", scenes: [
    { type: "title", title: "Les fonctions affines", sub: "Seconde · Fonctions", say: "Une fonction affine, c'est une droite. Deux nombres suffisent à la décrire : sa pente et son point de départ." },
    { type: "graph", heading: "f(x) = 2x − 1", xmin: -2, xmax: 4, ymin: -4, ymax: 6, formula: "f(x) = mx + p", curves: [{ fn: "2*x-1", label: "y = 2x − 1" }], points: [{ x: 0, y: -1, label: "p = −1" }, { x: 1, y: 1, label: "(1 ; 1)" }], say: "f de x égale m x plus p. Ici, m vaut deux et p vaut moins un. p est l'ordonnée à l'origine : la droite coupe l'axe des ordonnées en moins un." },
    { type: "say", heading: "Le coefficient directeur", lines: ["Quand x augmente de 1, f(x) augmente de m", "m > 0 : la droite monte", "m < 0 : elle descend ; m = 0 : elle est horizontale"], hl: 0, say: "m, le coefficient directeur, c'est la pente : quand x avance de un, f de x augmente de m. Si m est positif, la droite monte ; s'il est négatif, elle descend." },
    { type: "steps", heading: "Trouver m avec deux points", lines: ["A(1 ; 3) et B(4 ; 9)", "m = (y_B − y_A)/(x_B − x_A) = (9 − 3)/(4 − 1)", "m = 2", "3 = 2 × 1 + p, donc p = 1"], say: "Avec deux points A un, trois et B quatre, neuf : m égale la différence des ordonnées sur la différence des abscisses, six sur trois, donc deux. Puis on remplace avec A pour trouver p : p égale un." },
    { type: "quiz", q: "La droite qui passe par A(0 ; 5) et B(2 ; 1) a pour équation :", options: ["y = −2x + 5", "y = 2x + 5", "y = −2x + 1", "y = 5x − 2"], answer: 0, explain: "m = (1 − 5)/(2 − 0) = −2 et p = 5, l'ordonnée à l'origine.", say: "À toi : quelle est l'équation de la droite qui passe par zéro, cinq et par deux, un ?" },
    { type: "recap", points: ["f(x) = mx + p : une droite", "m = (y_B − y_A)/(x_B − x_A)", "p : ordonnée à l'origine"], say: "À retenir : m est la pente, calculée avec deux points, et p est la hauteur où la droite coupe l'axe des ordonnées." },
  ]},
  "n2-repere": { notion: "n2-repere", title: "Calculer dans un repère", scenes: [
    { type: "title", title: "Calculer dans un repère", sub: "Seconde · Géométrie", say: "Vecteur, milieu, distance : trois formules pour tout calculer à partir des coordonnées." },
    { type: "vectors", heading: "Le vecteur AB", points: { A: [1, 3], B: [5, 1] }, arrows: [["A", "B"]], say: "Prenons A un, trois et B cinq, un. Pour aller de A à B, on avance de quatre et on descend de deux : le vecteur AB a pour coordonnées quatre, moins deux. On fait toujours arrivée moins départ." },
    { type: "steps", heading: "Coordonnées du vecteur", lines: ["vec(AB)(x_B − x_A ; y_B − y_A)", "vec(AB)(5 − 1 ; 1 − 3)", "vec(AB)(4 ; −2)"], say: "En formule : x de B moins x de A, et y de B moins y de A. Ce qui donne bien quatre, moins deux." },
    { type: "steps", heading: "Le milieu de [AB]", lines: ["x_I = (x_A + x_B)/2 = (1 + 5)/2 = 3", "y_I = (y_A + y_B)/2 = (3 + 1)/2 = 2", "I(3 ; 2)"], say: "Le milieu, c'est la moyenne des coordonnées. Un plus cinq sur deux, trois. Trois plus un sur deux, deux. Le milieu est le point trois, deux." },
    { type: "steps", heading: "La distance AB", lines: ["AB = √((x_B − x_A)² + (y_B − y_A)²)", "AB = √(4² + (−2)²) = √20", "AB = 2√5"], say: "Et la distance, c'est Pythagore : racine de quatre au carré plus moins deux au carré, racine de vingt, soit deux racine de cinq." },
    { type: "quiz", q: "Le milieu de C(−2 ; 4) et D(6 ; 0) est :", options: ["(2 ; 2)", "(4 ; 4)", "(8 ; −4)", "(2 ; 4)"], answer: 0, explain: "((−2 + 6)/2 ; (4 + 0)/2) = (2 ; 2).", say: "À toi : quel est le milieu de C moins deux, quatre et de D six, zéro ?" },
    { type: "recap", points: ["vec(AB) : arrivée moins départ", "Milieu : moyenne des coordonnées", "Distance : Pythagore"], say: "À retenir : arrivée moins départ pour un vecteur, la moyenne pour un milieu, et Pythagore pour une distance." },
  ]},
  "n2-colinearite": { notion: "n2-colinearite", title: "Vecteurs colinéaires", scenes: [
    { type: "title", title: "Vecteurs colinéaires", sub: "Seconde · Géométrie", say: "Deux vecteurs colinéaires ont la même direction. Ce petit calcul permet de prouver un alignement ou un parallélisme." },
    { type: "vectors", heading: "Même direction", points: { A: [0, 0], B: [2, 3], C: [1, 0], D: [5, 6] }, arrows: [["A", "B"], ["C", "D", "red"]], say: "Le vecteur AB a pour coordonnées deux, trois. Le vecteur CD a pour coordonnées quatre, six. CD, c'est deux fois AB : ils ont la même direction. On dit qu'ils sont colinéaires." },
    { type: "steps", heading: "Le critère du déterminant", lines: ["u(x ; y) et v(x' ; y')", "colinéaires ⟺ xy' − x'y = 0", "2 × 6 − 4 × 3 = 12 − 12 = 0"], say: "Pour vérifier sans chercher le coefficient, on calcule x y prime moins x prime y. Si ça fait zéro, les vecteurs sont colinéaires. Ici, deux fois six moins quatre fois trois : zéro." },
    { type: "steps", heading: "Trois points alignés ?", lines: ["A(1 ; 2), B(3 ; 5), C(7 ; 11)", "vec(AB)(2 ; 3) et vec(AC)(6 ; 9)", "2 × 9 − 6 × 3 = 0 : A, B, C alignés"], say: "A, B et C sont alignés si les vecteurs AB et AC sont colinéaires. AB vaut deux, trois ; AC vaut six, neuf. Le déterminant est nul : les trois points sont alignés." },
    { type: "say", heading: "À quoi ça sert", lines: ["vec(AB) et vec(CD) colinéaires ⟺ (AB) ∥ (CD)", "vec(AB) et vec(AC) colinéaires ⟺ A, B, C alignés"], hl: 0, say: "Retiens les deux usages : AB et CD colinéaires, c'est le parallélisme des droites. AB et AC colinéaires, c'est l'alignement des points." },
    { type: "quiz", q: "u(3 ; −1) et v(−6 ; k) sont colinéaires pour k =", options: ["2", "−2", "3", "−3"], answer: 0, explain: "3 × k − (−6) × (−1) = 3k − 6 = 0, donc k = 2.", say: "À toi : pour quelle valeur de k les vecteurs trois, moins un et moins six, k sont-ils colinéaires ?" },
    { type: "recap", points: ["Colinéaires : v = ku", "Critère : xy' − x'y = 0", "Sert pour l'alignement et le parallélisme"], say: "À retenir : un déterminant nul, et c'est gagné, qu'il s'agisse d'alignement ou de parallélisme." },
  ]},
  "n2-droites": { notion: "n2-droites", title: "Équations de droites", scenes: [
    { type: "title", title: "Équations de droites", sub: "Seconde · Géométrie", say: "Une droite peut s'écrire de deux façons : y égale m x plus p, ou a x plus b y plus c égale zéro. On passe facilement de l'une à l'autre." },
    { type: "graph", heading: "2x + 3y − 6 = 0", xmin: -2, xmax: 5, ymin: -2, ymax: 4, curves: [{ fn: "2-2*x/3", label: "2x + 3y − 6 = 0" }], points: [{ x: 0, y: 2, label: "(0 ; 2)" }, { x: 3, y: 0, label: "(3 ; 0)" }], say: "Voici la droite d'équation deux x plus trois y moins six égale zéro. Pour la tracer, on cherche deux points : avec x égale zéro, y vaut deux ; avec y égale zéro, x vaut trois." },
    { type: "steps", heading: "Vers la forme réduite", lines: ["2x + 3y − 6 = 0", "3y = −2x + 6", "y = −(2/3)x + 2"], say: "On isole y : trois y égale moins deux x plus six, puis on divise par trois. y égale moins deux tiers x, plus deux. La pente vaut moins deux tiers." },
    { type: "say", heading: "Le vecteur directeur", lines: ["ax + by + c = 0", "vecteur directeur u(−b ; a)", "ici u(−3 ; 2)"], hl: 1, say: "De l'équation a x plus b y plus c égale zéro, on lit directement un vecteur directeur : moins b, a. Ici, moins trois, deux. Il donne la direction de la droite." },
    { type: "say", heading: "Les droites verticales", lines: ["x = 4 : droite verticale", "pas de forme y = mx + p", "mais x − 4 = 0 convient"], hl: 0, say: "Les droites verticales n'ont pas d'équation réduite y égale m x plus p. Mais la forme générale marche toujours : x moins quatre égale zéro." },
    { type: "quiz", q: "Un vecteur directeur de la droite 5x − y + 2 = 0 est :", options: ["(1 ; 5)", "(5 ; −1)", "(−1 ; 5)", "(5 ; 2)"], answer: 0, explain: "u(−b ; a) avec a = 5 et b = −1 : u(1 ; 5).", say: "À toi : donne un vecteur directeur de la droite cinq x moins y plus deux égale zéro." },
    { type: "recap", points: ["y = mx + p : forme réduite (droite non verticale)", "ax + by + c = 0 : forme générale", "Vecteur directeur (−b ; a)"], say: "À retenir : la forme réduite donne la pente, la forme générale marche pour toutes les droites, et elle donne le vecteur directeur moins b, a." },
  ]},
  "n2-stats": { notion: "n2-stats", title: "Résumer une série statistique", scenes: [
    { type: "title", title: "Résumer une série", sub: "Seconde · Statistiques", say: "Une série de notes, de tailles, de temps : quelques nombres suffisent à la résumer. Moyenne, médiane, quartiles." },
    { type: "steps", heading: "La moyenne", lines: ["Notes : 8, 12, 9, 15, 11", "somme = 8 + 12 + 9 + 15 + 11 = 55", "moyenne = 55/5 = 11"], say: "La moyenne : on additionne toutes les valeurs, puis on divise par l'effectif. Ici, cinquante-cinq divisé par cinq : onze." },
    { type: "steps", heading: "La médiane", lines: ["On range : 8, 9, 11, 12, 15", "la valeur du milieu : 11", "effectif pair : moyenne des deux valeurs du milieu"], say: "La médiane, c'est la valeur du milieu, une fois la série rangée dans l'ordre. Elle partage la série en deux moitiés. Si l'effectif est pair, on prend la moyenne des deux valeurs centrales." },
    { type: "say", heading: "Moyenne ou médiane ?", lines: ["Notes : 8, 9, 11, 12, 60", "moyenne = 20", "médiane = 11"], hl: 2, say: "Remplace quinze par soixante : la moyenne grimpe à vingt, la médiane reste à onze. La médiane résiste aux valeurs extrêmes, la moyenne non." },
    { type: "say", heading: "Quartiles et écart-type", lines: ["Q₁ : au moins 25 % des valeurs sont ≤ Q₁", "Q₃ : au moins 75 % des valeurs sont ≤ Q₃", "écart-type : dispersion autour de la moyenne"], hl: -1, say: "Les quartiles découpent la série en quatre parts. Et l'écart-type mesure la dispersion : plus il est grand, plus les valeurs sont éloignées de la moyenne." },
    { type: "quiz", q: "La médiane de 3, 7, 1, 9, 4, 6 est :", options: ["5", "4", "6", "5,5"], answer: 0, explain: "Rangée : 1, 3, 4, 6, 7, 9. Effectif pair : (4 + 6)/2 = 5.", say: "À toi : quelle est la médiane de trois, sept, un, neuf, quatre, six ?" },
    { type: "recap", points: ["Moyenne : somme ÷ effectif", "Médiane : valeur du milieu de la série rangée", "La médiane résiste aux valeurs extrêmes"], say: "À retenir : on range la série avant de chercher la médiane, et on préfère la médiane quand il y a des valeurs extrêmes." },
  ]},
  "n2-probas": { notion: "n2-probas", title: "Calculer une probabilité", scenes: [
    { type: "title", title: "Calculer une probabilité", sub: "Seconde · Probabilités", say: "Lancer un dé, tirer une carte : quand toutes les issues ont la même chance, une probabilité, c'est une fraction. Et deux formules font le reste." },
    { type: "steps", heading: "Situation d'équiprobabilité", lines: ["Dé à 6 faces, A : « obtenir un nombre pair »", "A = {2 ; 4 ; 6}", "p(A) = 3/6 = 1/2"], say: "Avec un dé équilibré, chaque face a la même chance. p de A égale le nombre de cas favorables divisé par le nombre de cas possibles : trois sur six, un demi." },
    { type: "say", heading: "L'événement contraire", lines: ["bar(A) : A ne se réalise pas", "p(bar(A)) = 1 − p(A)", "p(« ne pas faire 6 ») = 1 − 1/6 = 5/6"], hl: 1, say: "L'événement contraire, A barre, se réalise quand A ne se réalise pas. Sa probabilité, c'est un moins p de A. C'est pratique quand le contraire est plus simple à compter." },
    { type: "steps", heading: "A ou B", lines: ["A : pair, B : supérieur ou égal à 5", "A ∩ B = {6}", "p(A ∪ B) = 3/6 + 2/6 − 1/6 = 4/6 = 2/3"], say: "Pour A ou B, on additionne les probabilités, mais on retire l'intersection, sinon on la compte deux fois. Trois sixièmes plus deux sixièmes moins un sixième : deux tiers." },
    { type: "say", heading: "La formule", lines: ["p(A ∪ B) = p(A) + p(B) − p(A ∩ B)"], hl: 0, say: "À retenir par cœur : p de A union B égale p de A plus p de B, moins p de A inter B." },
    { type: "quiz", q: "p(A) = 0,5 ; p(B) = 0,4 ; p(A ∩ B) = 0,1. Alors p(A ∪ B) =", options: ["0,8", "0,9", "1", "0,2"], answer: 0, explain: "0,5 + 0,4 − 0,1 = 0,8.", say: "À toi : p de A vaut zéro virgule cinq, p de B zéro virgule quatre, et l'intersection zéro virgule un. Combien vaut p de A union B ?" },
    { type: "recap", points: ["Équiprobabilité : cas favorables ÷ cas possibles", "p(bar(A)) = 1 − p(A)", "p(A ∪ B) = p(A) + p(B) − p(A ∩ B)"], say: "À retenir : on compte les cas, on pense à l'événement contraire, et on n'oublie pas de retirer l'intersection." },
  ]},

  /* ======================= PREMIÈRE ======================= */
  "n1-canonique": { notion: "n1-canonique", title: "La forme canonique", scenes: [
    { type: "title", title: "La forme canonique", sub: "Première · Second degré", say: "Écrire un trinôme sous forme canonique, c'est lire directement le sommet de la parabole. Voici la méthode." },
    { type: "say", heading: "La forme canonique", lines: ["ax² + bx + c = a(x − α)² + β", "α = −b/(2a) et β = f(α)", "sommet de la parabole : S(α ; β)"], hl: 2, say: "Tout trinôme a x carré plus b x plus c peut s'écrire a fois x moins alpha au carré, plus bêta. Alpha vaut moins b sur deux a, et bêta vaut f de alpha. Le point alpha, bêta est le sommet de la parabole." },
    { type: "steps", heading: "Exemple : x² − 4x + 1", lines: ["α = −(−4)/(2 × 1) = 2", "β = f(2) = 4 − 8 + 1 = −3", "x² − 4x + 1 = (x − 2)² − 3"], say: "Pour x carré moins quatre x plus un : alpha égale quatre sur deux, donc deux. Bêta égale f de deux : quatre moins huit plus un, moins trois. La forme canonique est x moins deux au carré, moins trois." },
    { type: "graph", heading: "Le sommet se lit directement", xmin: -1, xmax: 5, ymin: -4, ymax: 6, curves: [{ fn: "(x-2)^2-3", label: "y = (x − 2)² − 3" }], points: [{ x: 2, y: -3, label: "S(2 ; −3)" }], say: "Sur la parabole, le sommet est bien le point deux, moins trois. Comme a est positif, la parabole est tournée vers le haut : moins trois est le minimum." },
    { type: "say", heading: "Ce qu'on en tire", lines: ["a > 0 : minimum β, atteint en α", "a < 0 : maximum β, atteint en α", "axe de symétrie : x = α"], hl: 2, say: "Si a est positif, bêta est un minimum ; si a est négatif, c'est un maximum. Et la droite verticale x égale alpha est l'axe de symétrie de la parabole." },
    { type: "quiz", q: "Le sommet de la parabole y = −2(x + 1)² + 5 est :", options: ["(−1 ; 5)", "(1 ; 5)", "(−1 ; −5)", "(2 ; 5)"], answer: 0, explain: "x + 1 = x − (−1), donc α = −1, et β = 5.", say: "À toi : quel est le sommet de la parabole moins deux fois x plus un au carré, plus cinq ?" },
    { type: "recap", points: ["a(x − α)² + β avec α = −b/(2a)", "β = f(α)", "Sommet S(α ; β), axe x = α"], say: "À retenir : alpha égale moins b sur deux a, bêta égale f de alpha, et le sommet se lit tout de suite." },
  ]},
  "n1-discriminant": { notion: "n1-discriminant", title: "Le discriminant", scenes: [
    { type: "title", title: "Le discriminant", sub: "Première · Second degré", say: "Combien de solutions pour une équation du second degré ? Un seul nombre décide : delta." },
    { type: "say", heading: "Le discriminant", lines: ["ax² + bx + c = 0", "Δ = b² − 4ac"], hl: 1, say: "Pour une équation a x carré plus b x plus c égale zéro, on calcule delta, qui vaut b carré moins quatre a c." },
    { type: "say", heading: "Trois cas", lines: ["Δ > 0 : deux racines (−b − √Δ)/(2a) et (−b + √Δ)/(2a)", "Δ = 0 : une racine double −b/(2a)", "Δ < 0 : aucune racine réelle"], hl: 0, say: "Si delta est positif, il y a deux racines : moins b moins racine de delta sur deux a, et moins b plus racine de delta sur deux a. Si delta est nul, une seule racine. Si delta est négatif, aucune solution réelle." },
    { type: "steps", heading: "Exemple : x² − x − 6 = 0", lines: ["Δ = (−1)² − 4 × 1 × (−6) = 25", "√Δ = 5", "x₁ = (1 − 5)/2 = −2 et x₂ = (1 + 5)/2 = 3"], say: "Delta égale un plus vingt-quatre, donc vingt-cinq. Racine de delta : cinq. Les racines sont un moins cinq sur deux, moins deux, et un plus cinq sur deux, trois." },
    { type: "graph", heading: "Δ et la parabole", xmin: -4, xmax: 4, ymin: -3, ymax: 6, curves: [{ fn: "x^2-1", label: "Δ > 0" }, { fn: "x^2", label: "Δ = 0", color: "green" }, { fn: "x^2+2", label: "Δ < 0", color: "red" }], say: "Graphiquement, delta dit combien de fois la parabole coupe l'axe des abscisses : deux fois, une seule fois en le touchant, ou jamais." },
    { type: "quiz", q: "L'équation 2x² + 3x + 5 = 0 :", options: ["n'a pas de solution réelle", "a deux solutions", "a une solution double", "a pour solution x = −5/3"], answer: 0, explain: "Δ = 9 − 40 = −31 < 0.", say: "À toi : combien de solutions pour deux x carré plus trois x plus cinq égale zéro ?" },
    { type: "recap", points: ["Δ = b² − 4ac", "Δ > 0 : deux racines ; Δ = 0 : une ; Δ < 0 : aucune", "Racines : (−b ± √Δ)/(2a)"], say: "À retenir : on calcule delta d'abord, son signe donne le nombre de solutions, et la formule donne les racines." },
  ]},
  "n1-suites": { notion: "n1-suites", title: "Les suites numériques", scenes: [
    { type: "title", title: "Les suites numériques", sub: "Première · Suites", say: "Une suite, c'est une liste de nombres numérotés. On peut la définir de deux façons, et ça change tout pour les calculs." },
    { type: "say", heading: "Une liste numérotée", lines: ["u₀, u₁, u₂, …, uₙ, …", "n : le rang ; uₙ : le terme de rang n"], hl: 1, say: "On note u indice n le terme de rang n. u zéro est le premier terme, u un le suivant, et ainsi de suite." },
    { type: "steps", heading: "Forme explicite", lines: ["uₙ = 3n + 1", "u₀ = 1, u₁ = 4, u₂ = 7", "u₁₀₀ = 301, directement"], say: "Forme explicite : u n est donné en fonction de n. On calcule n'importe quel terme directement : u cent égale trois fois cent plus un, trois cent un." },
    { type: "steps", heading: "Par récurrence", lines: ["u₀ = 1 et uₙ₊₁ = 2uₙ + 1", "u₁ = 2 × 1 + 1 = 3", "u₂ = 2 × 3 + 1 = 7", "u₃ = 2 × 7 + 1 = 15"], say: "Par récurrence : on donne le premier terme, et une règle pour passer d'un terme au suivant. u un égale deux fois u zéro plus un, trois. Puis sept, puis quinze. Pour u cent, il faudrait tout calculer étape par étape." },
    { type: "say", heading: "Attention à l'écriture", lines: ["uₙ₊₁ : le terme suivant", "uₙ + 1 : le terme, plus un", "ce n'est pas du tout la même chose !"], hl: 2, say: "Ne confonds pas u indice n plus un, qui est le terme suivant, et u n plus un, le terme auquel on ajoute un. Ce n'est pas du tout la même chose." },
    { type: "quiz", q: "u₀ = 2 et uₙ₊₁ = uₙ² − 1. Alors u₂ =", options: ["8", "3", "15", "1"], answer: 0, explain: "u₁ = 2² − 1 = 3, puis u₂ = 3² − 1 = 8.", say: "À toi : u zéro égale deux, et chaque terme est le carré du précédent, moins un. Combien vaut u deux ?" },
    { type: "recap", points: ["Explicite : uₙ en fonction de n", "Récurrence : uₙ₊₁ en fonction de uₙ", "uₙ₊₁ ≠ uₙ + 1"], say: "À retenir : la forme explicite pour calculer directement, la récurrence pour avancer pas à pas." },
  ]},
  "n1-arith": { notion: "n1-arith", title: "Suites arithmétiques", scenes: [
    { type: "title", title: "Suites arithmétiques", sub: "Première · Suites", say: "On ajoute toujours le même nombre. C'est la suite la plus simple, et elle sert partout, des économies aux escaliers." },
    { type: "say", heading: "La définition", lines: ["uₙ₊₁ = uₙ + r", "r : la raison", "5, 8, 11, 14, … : r = 3"], hl: 0, say: "Une suite est arithmétique quand on passe d'un terme au suivant en ajoutant toujours le même nombre r, la raison. Cinq, huit, onze, quatorze : on ajoute trois à chaque fois." },
    { type: "graph", heading: "Des points alignés", xmin: -0.5, xmax: 6, ymin: 0, ymax: 25, curves: [{ fn: "5+3*x", label: "uₙ = 5 + 3n" }], points: [{ x: 0, y: 5, label: "u₀" }, { x: 1, y: 8, label: "u₁" }, { x: 2, y: 11, label: "u₂" }, { x: 3, y: 14, label: "u₃" }, { x: 4, y: 17, label: "u₄" }], say: "Si on place les termes dans un repère, ils sont alignés : une suite arithmétique, c'est la version en pointillés d'une fonction affine." },
    { type: "steps", heading: "La formule explicite", lines: ["uₙ = u₀ + nr", "u₀ = 5 et r = 3", "u₁₀ = 5 + 10 × 3 = 35"], say: "Pour aller directement au rang n, on part de u zéro et on ajoute n fois la raison. Avec u zéro égale cinq et r égale trois, u dix égale trente-cinq." },
    { type: "say", heading: "Prouver qu'une suite est arithmétique", lines: ["On calcule uₙ₊₁ − uₙ", "si c'est une constante r : arithmétique", "uₙ = 4n − 7 : uₙ₊₁ − uₙ = 4"], hl: 1, say: "Pour le prouver, on calcule la différence entre deux termes consécutifs. Si elle est constante, la suite est arithmétique, et cette constante est la raison." },
    { type: "quiz", q: "u₀ = 20 et r = −4. Alors u₆ =", options: ["−4", "44", "−24", "16"], answer: 0, explain: "u₆ = 20 + 6 × (−4) = −4.", say: "À toi : u zéro égale vingt et la raison vaut moins quatre. Combien vaut u six ?" },
    { type: "recap", points: ["uₙ₊₁ = uₙ + r", "uₙ = u₀ + nr", "Preuve : uₙ₊₁ − uₙ constante"], say: "À retenir : on ajoute la raison, la formule explicite va directement au bon rang, et une différence constante prouve que la suite est arithmétique." },
  ]},
  "n1-geo": { notion: "n1-geo", title: "Suites géométriques", scenes: [
