  BAC.epreuves.forEach(e => { const o = out("pts_" + e.id); if (o) o.textContent = bv(e.id) !== null ? f1(bv(e.id) * e.coef) : "—"; });
  BAC.controle.forEach(c => [["_1", c.c1], ["_t", c.ct]].forEach(([s, k]) => { const o = out(`pts_${c.id}${s}`); if (o && k) o.textContent = bv(c.id + s) !== null ? f1(bv(c.id + s) * k) : "—"; }));
  const pe = out("pts_ep"); if (pe) pe.textContent = f1(BAC.epreuves.reduce((a, e) => a + (bv(e.id) || 0) * e.coef, 0));
  const ct = out("cc_tot"); if (ct) ct.textContent = `Total coef. du contrôle continu : ${r.cc} (seules les matières notées comptent).`;
  const seuils = BAC.seuils.map(([s, l]) => [s * r.coef, l]);
  const nxt = seuils.find(([p]) => r.pts < p);
  out("res").innerHTML = `<div class="res-main"><p class="eyebrow">Résultats · épreuves et contrôle continu</p><p class="big tnum">${f1(r.moy)}<small> / 20</small></p><p class="verdict ${r.moy >= 10 ? "ok" : r.moy >= 8 ? "mid" : "ko"}">${esc(r.verdict)}</p><p class="muted small">Total coef. ${r.coef} · total points ${f1(r.pts)}</p></div>
    <div class="res-seuils"><table class="tbl"><tbody><tr><th scope="row">Points actuels</th><td class="tnum strong">${f1(r.pts)}</td><td></td></tr>${seuils.map(([p, l]) => `<tr class="${r.pts >= p ? "done" : ""}"><th scope="row">Pour ${esc(l === "BAC" ? "obtenir le BAC" : l === "rattrapages" ? "obtenir les rattrapages" : "la " + l)}</th><td class="tnum">${f1(p)}</td><td>${r.pts >= p ? "✓" : `<span class="muted">− ${f1(p - r.pts)}</span>`}</td></tr>`).join("")}</tbody></table>
    ${nxt ? `<p class="small">Il te manque <b>${f1(nxt[0] - r.pts)} points</b> pour ${nxt[1] === "BAC" ? "le BAC" : nxt[1] === "rattrapages" ? "les rattrapages" : "la " + nxt[1]}, soit environ ${f1((nxt[0] - r.pts) / 16)} point de moyenne en plus dans une spécialité (coef. 16).</p>` : ""}</div>`;
  [1, 2, 3].forEach(p => { const pr = bacCalc(p), o = out("proj" + p); if (o) o.innerHTML = `<p class="tnum"><b>${f1(pr.moy)}</b>/20 · ${esc(pr.verdict.replace("BAC obtenu ", "").replace("BAC non obtenu, ", "").replace(/^,\s*/, ""))}</p><p class="muted small">${feas(p)}</p>`; });
}
function feas(p) {
  const pairs = [["philo", "philo"], ["spe1", "spe1"], ["spe2", "spe2"], ["go", "go"]].map(([a, b]) => [bv(a), bv(`p${p}_${b}`)]).filter(([c, t]) => c !== null && t !== null);
  if (!pairs.length) return "Entre tes notes actuelles pour voir la faisabilité.";
  const ecart = Math.max(...pairs.map(([c, t]) => t - c));
  const f = ENTRETIEN.faisabilite.find(([s]) => ecart <= s);
  return `Faisabilité : <b>${f[1]}</b><br><span>${ecart <= 0 ? "Aucun écart à combler" : `Plus grand écart : +${f1(ecart)} pt${ecart > 1 ? "s" : ""}`} · ${f[2]}.</span>`;
}

/* ---------- 📋 Mon entretien (Terminale) ---------- */
function vEntretien() {
  const E = S.entretien, r = bacCalc(), spe = EL.specialites || [];
  const radio = (k, opts) => `<div class="pills" role="radiogroup">${opts.map(o => `<label class="pill"><input type="radio" name="en-${k}" data-en="${k}" value="${esc(o)}" ${E[k] === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`;
  const multi = (k, opts) => `<div class="pills">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<label class="pill"><input type="checkbox" data-enm="${k}" value="${esc(v)}" ${(E[k] || []).includes(v) ? "checked" : ""}><span>${esc(l)}</span></label>`; }).join("")}</div>`;
  const ret = Number(S.bac.retenu) || 0, pr = ret ? bacCalc(ret) : null;
  const gain = id => { const c = bv(id), t = ret ? bv(`p${ret}_${id}`) : null; return c !== null && t !== null ? Math.max(0, t - c) * BAC.epreuves.find(e => e.id === id).coef : null; };
  const gS = (gain("spe1") || 0) + (gain("spe2") || 0), gP = gain("philo");
  const prio = ["Enseignement de spécialité 1", "Enseignement de spécialité 2", "Philosophie", "Grand oral"].map(x => [x, /spécialité (\d)/.test(x) && spe[Number(x.slice(-1)) - 1] ? `Spé ${x.slice(-1)} · ${spe[Number(x.slice(-1)) - 1]}` : x]);
  return head("📋", "Mon entretien individuel", "Ton intervenant fait le point avec toi pendant 10 à 20 minutes. Prépare tes réponses ici : tu gagneras du temps et l'entretien sera plus utile.") + `
  <section class="card en"><h2>💬 Contexte global et organisation</h2><p class="quote">« Si tu devais résumer en un mot ton état d'esprit aujourd'hui, ce serait quoi ? »</p>
    <label class="lab">En un mot<input class="in" data-en-t="mot" value="${esc(E.mot || "")}" placeholder="Ex. : motivé, perdu, confiant…"></label>
    ${ENTRETIEN.etat.map(q => `<div class="lab"><span>${esc(q.q)}</span>${radio(q.id, q.o)}</div>`).join("")}
    <h3>Organisation du travail personnel</h3>
    <div class="lab"><span>Créneaux fixes de travail</span>${radio("creneaux", ["Oui", "Non"])}</div>
    ${E.creneaux === "Oui" ? `<label class="lab">Lesquels ?<input class="in" data-en-t="creneauxTxt" value="${esc(E.creneauxTxt || "")}"></label>` : ""}
    <label class="lab">Heures de travail personnel par semaine<input class="in in-n" inputmode="decimal" data-en-t="heures" value="${esc(E.heures || "")}"><small class="muted">D'après ton emploi du temps : ${f1(S.edt.filter(e => e[4] === "perso").reduce((a, e) => a + minutes(e[2]) - minutes(e[1]), 0) / 60)} h de travail perso par semaine. Objectif conseillé : 14 h.</small></label>
    <label class="lab">Lieux de travail personnel<input class="in" data-en-t="lieux" value="${esc(E.lieux || "")}" placeholder="Chambre, CDI, bibliothèque…"></label>
  </section>
  <section class="card en top-gap"><h2>Difficultés et attentes</h2><p class="quote">« Pour qu'on puisse t'aider au mieux, il faut qu'on cible tes blocages. Qu'est-ce qui te freine le plus aujourd'hui ? »</p>
    <p class="muted small">Plusieurs réponses possibles.</p>
    ${ENTRETIEN.blocages.map(q => `<div class="lab"><span>${esc(q.q)}</span>${multi(q.id, q.o)}</div>`).join("")}
    <label class="lab">Autre blocage spécifique<input class="in" data-en-t="autre" value="${esc(E.autre || "")}" placeholder="Préciser…"></label>
    <label class="lab">Mon attente principale envers Sigma F<textarea class="in" rows="2" data-en-t="attente" placeholder="Sur quels éléments précis attends-tu que Sigma F t'apporte des réponses ?">${esc(E.attente || "")}</textarea></label>
    <h3>Retour d'expérience · Sigma Up</h3>${ENTRETIEN.retour.map(q => `<div class="lab"><span>${esc(q.q)}</span>${radio(q.id, q.o)}</div>`).join("")}
  </section>
  <section class="card en top-gap"><h2>🎯 Projection et trajectoire</h2>
    <p class="muted small">Rappel de ton onglet « Projection BAC » : pas besoin de changer d'onglet.</p>
    <div class="en-proj"><div><span class="eyebrow">Constat à date</span><b class="tnum">${f1(r.moy)}/20</b><small>${esc(r.verdict)}</small></div>
    ${[1, 2, 3].map(p => { const x = bacCalc(p); return `<div class="${ret === p ? "on" : ""}"><span class="eyebrow">Scénario ${p}${ret === p ? " · retenu" : ""}</span><b class="tnum">${f1(x.moy)}/20</b><small>${feas(p)}</small></div>`; }).join("")}</div>
    ${ret ? `<p class="top-gap">Pour le scénario retenu, il te faut gagner <b>${f1(gS)} points</b> en spécialités et <b>${f1(gP || 0)} points</b> en philosophie.</p>` : `<p class="top-gap muted">Choisis ton scénario retenu dans l'onglet <button class="linkish" data-go="bac">Projection BAC</button>.</p>`}
    <div class="lab"><span>Mes cibles d'effort prioritaires</span>${multi("priorites", prio)}</div>
  </section>
  <section class="card en top-gap"><h2>Prise de conscience et engagement</h2><p class="quote">« Le simulateur montre ce qui est possible. Concrètement, qu'est-ce que tu changes dès la semaine prochaine ? »</p>
    <div class="constats">${ENTRETIEN.constats.map(([c, sol]) => { const v = (E.constats || {})[c]; return `<div class="cst ${v && v !== "Non concerné" ? "on" : ""}"><div class="cst-h"><b>${esc(c)}</b><div class="pills sm">${["Concerné", "Partiellement concerné", "Non concerné"].map(o => `<label class="pill"><input type="radio" name="cst-${esc(c)}" data-cst="${esc(c)}" value="${o}" ${v === o ? "checked" : ""}><span>${o}</span></label>`).join("")}</div></div>${v && v !== "Non concerné" ? `<p class="sol">💡 ${esc(sol)}</p>` : ""}</div>`; }).join("")}</div>
    <label class="lab">Action spécifique supplémentaire<input class="in" data-en-t="action" value="${esc(E.action || "")}" placeholder="Une action concrète…"></label>
    <div class="lab"><span>Je m'engage à mettre en place les conseils</span>${radio("engage", ["Oui", "Partiellement", "Non"])}</div>
  </section>
  <section class="card en top-gap"><h2>Après l'entretien</h2>
    <div class="lab"><span>Que penses-tu de cet entretien personnalisé ?</span>${radio("avis", ["Très utile (à conserver absolument)", "Utile", "Peu d'intérêt"])}</div>
    <label class="lab">Ma remarque (axes d'amélioration)<input class="in" data-en-t="remarque" value="${esc(E.remarque || "")}" placeholder="Préciser…"></label>
  </section>`;
}

/* ======================================================================
   NAVIGATION, RENDU, ÉVÉNEMENTS
   ====================================================================== */
const RENDER = { sommaire: vSommaire, presentation: vPresentation, tableau: vTableau, planning: vPlanning, ressources: vRessources, videos: vVideos, notes: vNotes, actions: vActions, bac: vBac, entretien: vEntretien };
function renderChrome() {
  const vs = views();
  $("side-nav").innerHTML = vs.map(v => `<button class="nav-btn" data-go="${v.id}" ${VIEW === v.id ? 'aria-current="page"' : ""}><span class="nav-ico" aria-hidden="true">${v.ico}</span>${esc(v.t)}</button>`).join("");
  const tabs = [["sommaire", "≡", "Sommaire"], ["planning", "🗓️", "Planning"], ["ressources", "🗂️", "Cours"], ["notes", "✍🏻", "Notes"], ["plus", "⋯", "Plus"]];
  const inPlus = !["sommaire", "planning", "ressources", "notes"].includes(VIEW);
  $("tabs").innerHTML = tabs.map(([id, i, t]) => `<button class="tab" data-go="${id}" ${VIEW === id || (id === "plus" && inPlus) ? 'aria-current="page"' : ""}><span class="tab-ico" aria-hidden="true">${i}</span>${t}</button>`).join("");
  const me = `<button class="me-btn" data-act="profil"><span class="avatar" aria-hidden="true">${esc(EL.prenom[0] || "?")}</span><span><b>${esc(EL.prenom)} ${esc(EL.nom)}</b><small>${esc(NIVEAUX[NIV].nom)} · ${esc(EL.classe || "")}</small></span></button>`;
  $("side-foot").innerHTML = me;
  $("top-me").textContent = EL.prenom[0] || "?";
  $("demo").hidden = !estExemple();
  $("demo-level").value = NIV;
}
function render(focus) {
  renderChrome();
  main().innerHTML = (RENDER[VIEW] || vSommaire)();
  if (VIEW === "bac") majBac();
  if (focus) { main().focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }
}
function go(v, sub) {
  if (v === "plus") { openSheet(plusSheet()); return; }
  if (!RENDER[v] || (VIEWS.find(x => x.id === v) || {}).tle && NIV !== "tle") v = "sommaire";
  VIEW = v; if (sub) SUB[v] = sub; closeSheet(); render(true);
}
function plusSheet() {
  return `<h2 id="sheet-title">Tous les onglets</h2><div class="plus-list">${views().map(v => `<button class="nav-btn" data-go="${v.id}" ${VIEW === v.id ? 'aria-current="page"' : ""}><span class="nav-ico" aria-hidden="true">${v.ico}</span>${esc(v.t)}</button>`).join("")}</div><button class="btn btn-ghost" data-act="profil">Mon profil et réglages</button>`;
}
function profilSheet() {
  const g = groupe(), vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)) : [];
  return `<h2 id="sheet-title">${esc(EL.prenom)} ${esc(EL.nom)}</h2>
  <dl class="kv-list"><div><dt>Niveau</dt><dd>${esc(NIVEAUX[NIV].nom)}</dd></div><div><dt>Classe</dt><dd>${esc(EL.classe || "—")}</dd></div><div><dt>Groupe Sigma</dt><dd>${esc(g.nom || "—")}</dd></div><div><dt>Intervenant</dt><dd>${esc(g.intervenant || "À compléter")}</dd></div><div><dt>Code élève</dt><dd><code>${esc(EL.code)}</code></dd></div></dl>
  <div class="card soft"><h3>Voix des vidéos</h3><p class="muted small">${voixInfo()}</p>${!Object.keys(VOIX.map).length && vs.length ? `<p class="small">Voix disponibles sur cet appareil : ${vs.length}. Les plus naturelles (« Natural », « Google », « Premium ») sont proposées en premier dans le lecteur.</p>` : ""}</div>
  <form class="card soft" data-form="code"><h3>Ouvrir un autre passeport</h3><label class="lab">Code élève<input class="in" name="code" placeholder="Ton code personnel" autocomplete="off"></label><button class="btn btn-sm" type="submit">Ouvrir</button><p class="muted small" data-out="code-err"></p></form>
  ${ST.jeton && !estExemple() ? `<button class="btn btn-ghost" data-act="deconnexion">Se déconnecter de cet appareil</button>` : ""}
  ${estExemple() ? `<button class="btn btn-ghost" data-act="reset-ex">Remettre l'exemple à zéro</button>` : `<button class="btn btn-ghost" data-act="reset">Effacer mes saisies sur cet appareil</button>`}`;
}
let lastFocus = null;
function openSheet(html) { lastFocus = document.activeElement; $("sheet-body").innerHTML = html; $("sheet").hidden = false; document.body.classList.add("noscroll"); const f = $("sheet-body").querySelector("button,input,select"); if (f) f.focus(); }
function closeSheet() { if ($("sheet").hidden) return; $("sheet").hidden = true; document.body.classList.remove("noscroll"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => { el.classList.remove("on"); }, 2600); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-act],[data-seg],[data-play],[data-sess],[data-week],[data-note-del],[data-edt-del],[data-close]");
  if (!b) return;
  if (b.dataset.close !== undefined) return closeSheet();
  if (b.dataset.go) return go(b.dataset.go, b.dataset.sub);
  if (b.dataset.play) return playNotion(b.dataset.play);
  if (b.dataset.seg) { SUB[b.dataset.seg] = b.dataset.v; return render(); }
  if (b.dataset.sess) { const s = toutesSeances().find(x => x.iso === b.dataset.sess); const box = $("sess-detail"); if (s && box) { box.innerHTML = sessCard(s); box.scrollIntoView({ block: "nearest", behavior: "smooth" }); } return; }
  if (b.dataset.week) { const w = Number(b.dataset.week); if (!w) SUB.semaine = lundi(TODAY); else { const d = D(SUB.semaine); d.setDate(d.getDate() + w); SUB.semaine = isoOf(d); } return render(); }
  if (b.dataset.noteDel) { S.notes.splice(Number(b.dataset.noteDel), 1); save(); toast("Note supprimée"); return render(); }
  if (b.dataset.edtDel) { const k = Number(b.dataset.edtDel), x = S.edt[k]; S.edt.splice(k, 1); save(); toast(`Créneau « ${x[3]} » supprimé`); return render(); }
  const a = b.dataset.act;
  if (a === "profil") return openSheet(profilSheet());
  if (a === "connexion") return montrerConnexion();
  if (a === "deconnexion") { delete ST.jeton; save(); BASE.eleves = BASE.eleves.filter(e => /^exemple-/.test(e.code)); setEleve("exemple-1re"); closeSheet(); montrerConnexion(); return render(true); }
  if (a === "reset-ex" || a === "reset") { ST.saisies[EL.code] = a === "reset-ex" ? clone(EXEMPLE_SAISIE[EL.code] || {}) : {}; ST.vus[EL.code] = {}; setEleve(EL.code); closeSheet(); toast("C'est fait"); return render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.edtDel) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "demo-level") { setEleve("exemple-" + t.value); if ((VIEWS.find(v => v.id === VIEW) || {}).tle && NIV !== "tle") VIEW = "sommaire"; SUB = {}; return render(true); }
  if (t.dataset.ok) { S.infosOk[t.dataset.ok] = t.checked; save(); return render(); }
  if (t.dataset.en) { S.entretien[t.dataset.en] = t.value; save(); if (t.dataset.en === "creneaux") render(); return; }
  if (t.dataset.enm) { const k = t.dataset.enm, arr = new Set(S.entretien[k] || []); t.checked ? arr.add(t.value) : arr.delete(t.value); S.entretien[k] = [...arr]; save(); return; }
  if (t.dataset.cst) { S.entretien.constats = S.entretien.constats || {}; S.entretien.constats[t.dataset.cst] = t.value; save(); return render(); }
  if (t.dataset.retenu) { S.bac.retenu = Number(t.dataset.retenu); save(); return majBac(); }
  if (t.dataset.bac && t.tagName === "SELECT") { S.bac[t.dataset.bac] = t.value; save(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.k) { setK(t.dataset.k, t.value); return; }
  if (t.dataset.bac && t.tagName === "INPUT") { const v = t.value.trim(); if (v !== "" && (nb(v) === null || nb(v) < 0 || nb(v) > 20)) { t.setAttribute("aria-invalid", "true"); return; } t.removeAttribute("aria-invalid"); S.bac[t.dataset.bac] = v; save(); return majBac(); }
  if (t.dataset.moy) { const m = t.dataset.moy; S.moyennes[m] = S.moyennes[m] || ["", "", ""]; S.moyennes[m][Number(t.dataset.t)] = t.value; save(); return; }
  if (t.dataset.enT) { S.entretien[t.dataset.enT] = t.value; save(); return; }
});
document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  if (f.dataset.form === "note") {
    const n = nb(v.note); if (n === null || n < 0 || n > 20) { toast("La note doit être entre 0 et 20"); return; }
    S.notes.push({ date: v.date, matiere: v.matiere.trim(), notions: v.notions.trim(), note: n, moy: nb(v.moy), min: nb(v.min), max: nb(v.max), diff: v.diff.trim(), rem: v.rem.trim() });
    save(); toast("Note ajoutée"); SUB.notesMat = v.matiere.trim(); return render();
  }
  if (f.dataset.form === "edt") {
    if (minutes(v.f) <= minutes(v.d)) { toast("L'heure de fin doit être après le début"); return; }
    S.edt.push([Number(v.j), v.d, v.f, v.t.trim(), v.y]); save(); toast("Créneau ajouté"); return render();
  }
  if (f.dataset.form === "code") {
    const c = v.code.trim().toLowerCase(); if (eleve(c)) { setEleve(c); SUB = {}; VIEW = "sommaire"; closeSheet(); return render(true); }
    const o = f.querySelector('[data-out="code-err"]');
    if (!API) { if (o) o.textContent = "Code inconnu : vérifie le lien envoyé par Sigma F."; return; }
    if (o) o.textContent = "Vérification…";
    connexionApi(v.code.trim())
      .then(p => { if (ouvrirPasseport(p)) { SUB = {}; VIEW = "sommaire"; closeSheet(); render(true); toast("Bienvenue " + EL.prenom + " !"); } })
      .catch(err => { if (o) o.textContent = err.message; });
  }
});

/* ---------- voix enregistrées : intégrées au fichier (studio) ou dossier voix/ à côté du fichier ---------- */
async function chargerVoix() {
  if (window.VOIX_EMBED && window.VOIX_EMBED.clips) {
    const m = window.VOIX_EMBED; VOIX.name = m.voix || ""; for (const id in m.clips) { VOIX.map[id] = m.clips[id][0]; VOIX.src[id] = m.clips[id][1]; }
    return;
  }
  if (location.protocol.startsWith("http")) {
    try { const r = await fetch(VOIX.base + "manifest.json", { cache: "no-cache" }); if (r.ok) { const m = await r.json(); VOIX.map = m.clips || {}; VOIX.name = m.voix || ""; } } catch (e) { }
  }
  for (const k in PREP) delete PREP[k];
}

/* ---------- démarrage ---------- */
function montrerConnexion(msg) {
  $("login").hidden = false; document.body.classList.add("noscroll");
  $("login-err").textContent = msg || "";
  const l = document.querySelector(".top img"); if (l) $("login-logo").src = l.src;
  setTimeout(() => $("login-code").focus(), 50);
}
function cacherConnexion() { $("login").hidden = true; document.body.classList.remove("noscroll"); }
$("login-demo").onclick = () => { setEleve("exemple-1re"); SUB = {}; VIEW = "sommaire"; cacherConnexion(); render(true); };
$("login-form").addEventListener("submit", e => {
  e.preventDefault();
  const code = $("login-code").value.trim(), err = $("login-err");
  if (/^exemple/i.test(code)) { $("login-demo").onclick(); return; }
  if (!API) { err.textContent = "La connexion par code ouvre bientôt. En attendant, découvre l'exemple."; return; }
  err.textContent = "Vérification…";
  connexionApi(code)
    .then(p => { if (ouvrirPasseport(p)) { SUB = {}; VIEW = "sommaire"; cacherConnexion(); render(true); toast("Bienvenue " + EL.prenom + " !"); } else err.textContent = ""; })
    .catch(x => { err.textContent = x.message; });
});
(function start() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  const demo = h === "demo" || /^exemple-/.test(h);
  setEleve(eleve(h) ? h : "exemple-1re");
  render();
  chargerVoix().then(() => { if (VIEW === "videos") render(); });
  if (!demo) {
    if (API && ST.jeton) { montrerConnexion("Connexion…"); rechargerApi().then(() => { if (!estExemple()) cacherConnexion(); else montrerConnexion(); }); }
    else montrerConnexion();
  }
  window.addEventListener("hashchange", () => { const c = decodeURIComponent(location.hash.slice(1)); if (eleve(c) && c !== EL.code) { setEleve(c); SUB = {}; VIEW = "sommaire"; render(true); } });
