    { type: "title", title: "Suites géométriques", sub: "Première · Suites", say: "Cette fois, on multiplie toujours par le même nombre. C'est la suite des intérêts composés et des populations, et ça grimpe très vite." },
    { type: "say", heading: "La définition", lines: ["uₙ₊₁ = q × uₙ", "q : la raison", "2, 6, 18, 54, … : q = 3"], hl: 0, say: "Une suite est géométrique quand on passe d'un terme au suivant en multipliant par le même nombre q. Deux, six, dix-huit, cinquante-quatre : on multiplie par trois." },
    { type: "steps", heading: "La formule explicite", lines: ["uₙ = u₀ × qⁿ", "u₀ = 2 et q = 3", "u₄ = 2 × 3⁴ = 2 × 81 = 162"], say: "Au rang n : u zéro fois q puissance n. Avec u zéro égale deux et q égale trois, u quatre égale deux fois quatre-vingt-un, cent soixante-deux." },
    { type: "graph", heading: "Une croissance explosive", xmin: -0.5, xmax: 5, ymin: 0, ymax: 60, curves: [{ fn: "2*3^x", label: "géométrique" }, { fn: "2+4*x", label: "arithmétique", color: "green" }], points: [{ x: 0, y: 2, label: "u₀" }, { x: 1, y: 6, label: "u₁" }, { x: 2, y: 18, label: "u₂" }, { x: 3, y: 54, label: "u₃" }], say: "Compare avec une suite arithmétique qui part du même point. Au début, elles se ressemblent, puis la suite géométrique s'envole. Multiplier va beaucoup plus vite qu'ajouter." },
    { type: "steps", heading: "Pourcentages et suites", lines: ["+5 % par an : on multiplie par 1,05", "capital : uₙ = 1000 × 1,05ⁿ", "u₁₀ ≈ 1628,89 €"], say: "Une hausse de cinq pour cent par an, c'est multiplier par un virgule zéro cinq. Mille euros placés deviennent mille fois un virgule zéro cinq puissance n. Au bout de dix ans, environ mille six cent vingt-neuf euros." },
    { type: "quiz", q: "u₀ = 5 et q = 2. Alors u₃ =", options: ["40", "30", "11", "15"], answer: 0, explain: "u₃ = 5 × 2³ = 5 × 8 = 40.", say: "À toi : u zéro égale cinq et la raison vaut deux. Combien vaut u trois ?" },
    { type: "recap", points: ["uₙ₊₁ = q × uₙ", "uₙ = u₀ × qⁿ", "Hausse de t % : q = 1 + t/100"], say: "À retenir : on multiplie par la raison, u n égale u zéro fois q puissance n, et un pourcentage d'évolution donne la raison." },
  ]},
  "n1-variations-suites": { notion: "n1-variations-suites", title: "Une suite monte-t-elle ?", scenes: [
    { type: "title", title: "Sens de variation d'une suite", sub: "Première · Suites", say: "Croissante ou décroissante ? Pour une suite, la méthode la plus sûre tient en une soustraction." },
    { type: "say", heading: "La définition", lines: ["croissante : uₙ₊₁ ≥ uₙ pour tout n", "décroissante : uₙ₊₁ ≤ uₙ pour tout n"], hl: 0, say: "Une suite est croissante si chaque terme est supérieur ou égal au précédent, et décroissante si chaque terme est inférieur ou égal au précédent." },
    { type: "steps", heading: "Méthode : le signe de uₙ₊₁ − uₙ", lines: ["uₙ = n² + n", "uₙ₊₁ − uₙ = (n + 1)² + (n + 1) − n² − n", "= 2n + 2 > 0", "donc (uₙ) est croissante"], say: "Pour u n égale n carré plus n, on calcule u n plus un moins u n. Après simplification, il reste deux n plus deux, qui est positif. Donc la suite est croissante." },
    { type: "steps", heading: "Quand uₙ = f(n)", lines: ["uₙ = 1/(n + 1)", "f(x) = 1/(x + 1) est décroissante sur [0 ; +∞[", "donc (uₙ) est décroissante"], say: "Autre méthode : si u n égale f de n, les variations de f sur zéro, plus l'infini donnent celles de la suite. Un sur x plus un est décroissante, donc la suite aussi." },
    { type: "say", heading: "Suites de référence", lines: ["arithmétique : croissante si r > 0", "géométrique (u₀ > 0) : croissante si q > 1", "et décroissante si 0 < q < 1"], hl: 1, say: "Pour les suites de référence : une suite arithmétique est croissante si sa raison est positive. Une suite géométrique de premier terme positif est croissante si q dépasse un, et décroissante si q est entre zéro et un." },
    { type: "quiz", q: "La suite uₙ = 5 − 2n est :", options: ["décroissante", "croissante", "constante", "ni croissante ni décroissante"], answer: 0, explain: "uₙ₊₁ − uₙ = −2 < 0.", say: "À toi : la suite u n égale cinq moins deux n est-elle croissante ou décroissante ?" },
    { type: "recap", points: ["Signe de uₙ₊₁ − uₙ", "Si uₙ = f(n) : variations de f", "Arithmétique : signe de r ; géométrique : q et 1"], say: "À retenir : la différence de deux termes consécutifs, et son signe, donnent le sens de variation." },
  ]},
  "n1-derivees": { notion: "n1-derivees", title: "Les dérivées à connaître", scenes: [
    { type: "title", title: "Les dérivées à connaître", sub: "Première · Dérivation", say: "Pour dériver vite, il faut un formulaire dans la tête. Voici les formules indispensables, et comment les combiner." },
    { type: "say", heading: "Les fonctions de référence", lines: ["(k)' = 0 et (x)' = 1", "(xⁿ)' = nx^(n−1)", "(1/x)' = −1/x² et (√x)' = 1/(2√x)"], hl: 1, say: "La dérivée d'une constante est nulle, celle de x vaut un. Pour x puissance n, on fait descendre l'exposant et on lui enlève un. Et à connaître : la dérivée de un sur x et celle de racine de x." },
    { type: "steps", heading: "Sommes et constantes", lines: ["(u + v)' = u' + v' et (ku)' = ku'", "(x³ + 2x)' = 3x² + 2", "(5x⁴ − 3x)' = 20x³ − 3"], say: "Une somme se dérive terme à terme, et une constante multiplicative reste devant. Cinq x puissance quatre devient vingt x cube." },
    { type: "steps", heading: "Produit", lines: ["(uv)' = u'v + uv'", "u = 2x + 1 et v = x² − 3", "f'(x) = 2(x² − 3) + (2x + 1) × 2x", "= 6x² + 2x − 6"], say: "Pour un produit, attention : ce n'est pas le produit des dérivées. C'est u prime v plus u v prime. Pour deux x plus un, fois x carré moins trois, on obtient six x carré plus deux x moins six." },
    { type: "steps", heading: "Quotient", lines: ["(u/v)' = (u'v − uv')/v²", "f(x) = (x + 1)/(x − 2)", "f'(x) = ((x − 2) − (x + 1))/(x − 2)²", "= −3/(x − 2)²"], say: "Pour un quotient : u prime v moins u v prime, le tout sur v carré. Ici, x moins deux, moins x plus un, ça fait moins trois, sur x moins deux au carré." },
    { type: "quiz", q: "La dérivée de f(x) = 4x³ − x² + 7 est :", options: ["12x² − 2x", "12x² − 2x + 7", "4x² − 2x", "12x³ − 2x"], answer: 0, explain: "(4x³)' = 12x², (x²)' = 2x et (7)' = 0.", say: "À toi : dérive quatre x cube moins x carré plus sept." },
    { type: "recap", points: ["(xⁿ)' = nx^(n−1)", "(uv)' = u'v + uv'", "(u/v)' = (u'v − uv')/v²"], say: "À retenir : les formules de référence, puis les règles du produit et du quotient. Et jamais le produit des dérivées." },
  ]},
  "n1-variations": { notion: "n1-variations", title: "Dérivée et variations", scenes: [
    { type: "title", title: "Dérivée et variations", sub: "Première · Dérivation", say: "Le signe de la dérivée dit tout des variations. C'est la méthode reine pour étudier une fonction." },
    { type: "say", heading: "Le théorème", lines: ["f' > 0 sur I : f croissante sur I", "f' < 0 sur I : f décroissante sur I", "f' change de signe en a : extremum en a"], hl: 2, say: "Si la dérivée est positive sur un intervalle, la fonction y est croissante ; si elle est négative, décroissante. Et là où la dérivée s'annule en changeant de signe, il y a un extremum." },
    { type: "steps", heading: "Étudier f(x) = x³ − 3x² + 1", lines: ["f'(x) = 3x² − 6x = 3x(x − 2)", "f'(x) = 0 pour x = 0 ou x = 2", "f' > 0 avant 0 et après 2 ; f' < 0 entre"], say: "On dérive : trois x carré moins six x, qu'on factorise en trois x, fois x moins deux. La dérivée s'annule en zéro et en deux. C'est un trinôme avec a positif : positif à l'extérieur des racines, négatif entre elles." },
    { type: "say", heading: "Les variations en résumé", lines: ["sur ]−∞ ; 0] : f' ≥ 0, f croissante", "sur [0 ; 2] : f' ≤ 0, f décroissante (de 1 à −3)", "sur [2 ; +∞[ : f' ≥ 0, f croissante"], hl: 1, say: "On résume : f croît jusqu'à zéro, où elle atteint un maximum local, un. Puis elle décroît jusqu'à deux, son minimum local, moins trois. Puis elle croît de nouveau." },
    { type: "graph", heading: "La courbe confirme", xmin: -1.5, xmax: 3.5, ymin: -4, ymax: 3, curves: [{ fn: "x^3-3*x^2+1", label: "courbe de f" }], points: [{ x: 0, y: 1, label: "max (0 ; 1)" }, { x: 2, y: -3, label: "min (2 ; −3)" }], say: "Et la courbe confirme : un sommet en zéro, un creux en deux, avec une tangente horizontale à chacun de ces deux endroits." },
    { type: "quiz", q: "f'(x) = (x − 1)(x + 4). Sur [−4 ; 1], f est :", options: ["décroissante", "croissante", "constante", "on ne peut pas savoir"], answer: 0, explain: "Entre ses racines −4 et 1, ce trinôme (a = 1 > 0) est négatif : f décroît.", say: "À toi : f prime de x égale x moins un, fois x plus quatre. Comment varie f entre moins quatre et un ?" },
    { type: "recap", points: ["Signe de f' ⟹ variations de f", "Extremum là où f' s'annule en changeant de signe", "Dériver, factoriser, étudier le signe, conclure"], say: "À retenir : dériver, factoriser, étudier le signe, puis dresser le tableau de variations." },
  ]},
  "n1-exp": { notion: "n1-exp", title: "La fonction exponentielle", scenes: [
    { type: "title", title: "La fonction exponentielle", sub: "Première · Fonction exponentielle", say: "Une fonction égale à sa propre dérivée : c'est l'exponentielle. Et ses règles de calcul ressemblent à celles des puissances." },
    { type: "graph", heading: "La courbe de exp", xmin: -3, xmax: 2.5, ymin: -1, ymax: 8, curves: [{ fn: "exp(x)", label: "y = eˣ" }], points: [{ x: 0, y: 1, label: "(0 ; 1)" }, { x: 1, y: 2.718, label: "(1 ; e)" }], say: "Voici la courbe de l'exponentielle. Elle passe par le point zéro, un, puisque e puissance zéro égale un. Elle reste toujours au-dessus de l'axe : e puissance x est toujours strictement positif. Et elle est croissante." },
    { type: "say", heading: "La définition", lines: ["exp' = exp et exp(0) = 1", "e = exp(1) ≈ 2,718", "eˣ > 0 pour tout réel x"], hl: 0, say: "L'exponentielle est l'unique fonction égale à sa dérivée et qui vaut un en zéro. Son image en un est le nombre e, environ deux virgule sept un huit." },
    { type: "say", heading: "Les règles de calcul", lines: ["e^(a+b) = eᵃ × eᵇ", "e^(−a) = 1/eᵃ", "(eᵃ)ⁿ = e^(na)"], hl: 0, say: "Ce sont les mêmes règles que pour les puissances : e puissance a plus b égale e puissance a fois e puissance b. Et un exposant opposé donne l'inverse." },
    { type: "steps", heading: "Résoudre une équation", lines: ["e^(3x+1) = e^(x+5)", "3x + 1 = x + 5", "x = 2"], say: "Comme l'exponentielle est strictement croissante, e puissance a égale e puissance b équivaut à a égale b. On résout trois x plus un égale x plus cinq : x égale deux." },
    { type: "quiz", q: "e² × e⁵ ÷ e³ = ?", options: ["e⁴", "e¹⁰", "e⁷", "e^(7/3)"], answer: 0, explain: "e^(2 + 5 − 3) = e⁴.", say: "À toi : e au carré, fois e puissance cinq, divisé par e cube, ça fait combien ?" },
    { type: "recap", points: ["exp' = exp, e⁰ = 1 et eˣ > 0", "e^(a+b) = eᵃ × eᵇ", "eᵃ = eᵇ ⟺ a = b"], say: "À retenir : égale à sa dérivée, toujours positive, et les règles des puissances." },
  ]},
  "n1-cercle": { notion: "n1-cercle", title: "Le cercle trigonométrique", scenes: [
    { type: "title", title: "Le cercle trigonométrique", sub: "Première · Trigonométrie", say: "En trigonométrie, on mesure les angles en radians, sur un cercle de rayon un. Une fois le principe compris, les conversions deviennent faciles." },
    { type: "graph", heading: "Le cercle trigonométrique", xmin: -1.63, xmax: 1.63, ymin: -1.2, ymax: 1.2, formula: "un tour = 2π rad", curves: CERCLE, points: [{ x: 1, y: 0, label: "0" }, { x: 0, y: 1, label: "π/2" }, { x: -1, y: 0, label: "π" }, { x: 0.5, y: 0.866, label: "π/3" }], say: "Sur un cercle de rayon un, on enroule la droite des réels. Le sens positif est le sens inverse des aiguilles d'une montre. Un tour complet mesure deux pi : c'est la longueur du cercle." },
    { type: "steps", heading: "Degrés et radians", lines: ["2π rad = 360°, donc π rad = 180°", "60° = 60 × π/180 = π/3 rad", "π/4 rad = 45°"], say: "Puisque pi radians valent cent quatre-vingts degrés, pour convertir des degrés en radians, on multiplie par pi sur cent quatre-vingts. Soixante degrés, c'est pi sur trois." },
    { type: "say", heading: "Les angles à connaître", lines: ["π/6 = 30°, π/4 = 45°, π/3 = 60°", "π/2 = 90° et π = 180°", "−π/2 : un quart de tour dans l'autre sens"], hl: 0, say: "Retiens les angles remarquables : pi sur six, pi sur quatre, pi sur trois, pi sur deux. Et un angle négatif, c'est simplement tourner dans l'autre sens." },
    { type: "say", heading: "Un point, plusieurs mesures", lines: ["π/3 et π/3 + 2π : même point", "à 2π près, on retombe au même endroit", "mesure principale : dans ]−π ; π]"], hl: 1, say: "Faire un tour de plus ramène au même point : pi sur trois et pi sur trois plus deux pi repèrent le même point du cercle. On choisit souvent la mesure principale, entre moins pi et pi." },
    { type: "quiz", q: "150° en radians vaut :", options: ["5π/6", "3π/4", "5π/3", "2π/3"], answer: 0, explain: "150 × π/180 = 5π/6.", say: "À toi : combien font cent cinquante degrés en radians ?" },
    { type: "recap", points: ["Un tour = 2π rad", "π rad = 180°", "Degrés → radians : × π/180"], say: "À retenir : pi radians, c'est cent quatre-vingts degrés, et les mesures se répètent tous les deux pi." },
  ]},
  "n1-cos-sin": { notion: "n1-cos-sin", title: "Cosinus et sinus", scenes: [
    { type: "title", title: "Cosinus et sinus", sub: "Première · Trigonométrie", say: "Sur le cercle trigonométrique, chaque réel donne un point. Ses coordonnées s'appellent cosinus et sinus." },
    { type: "graph", heading: "Le point associé à x", xmin: -1.63, xmax: 1.63, ymin: -1.2, ymax: 1.2, formula: "M(cos x ; sin x)", curves: CERCLE, points: [{ x: 0.5, y: 0.866, label: "M" }], say: "Au réel x, on associe le point M du cercle. Son abscisse est le cosinus de x, son ordonnée est le sinus de x. Ici, pour x égale pi sur trois, M a pour coordonnées un demi, racine de trois sur deux." },
    { type: "say", heading: "Les valeurs à connaître", lines: ["cos 0 = 1 et sin 0 = 0", "cos(π/3) = 1/2 et sin(π/3) = √3/2", "cos(π/6) = √3/2 et sin(π/6) = 1/2", "cos(π/4) = sin(π/4) = √2/2"], hl: 1, say: "Les valeurs remarquables : en pi sur trois, cosinus un demi et sinus racine de trois sur deux. En pi sur six, c'est l'inverse. Et en pi sur quatre, les deux valent racine de deux sur deux." },
    { type: "say", heading: "Les relations", lines: ["cos²x + sin²x = 1", "−1 ≤ cos x ≤ 1 et −1 ≤ sin x ≤ 1", "cos(−x) = cos x et sin(−x) = −sin x"], hl: 0, say: "Comme M est sur un cercle de rayon un, Pythagore donne cosinus carré plus sinus carré égale un. Cosinus et sinus restent entre moins un et un. Et changer x en moins x garde le cosinus, mais change le signe du sinus." },
    { type: "steps", heading: "Exemple", lines: ["cos x = 3/5 et x ∈ ]0 ; π/2[", "sin²x = 1 − 9/25 = 16/25", "sin x > 0, donc sin x = 4/5"], say: "Si le cosinus de x vaut trois cinquièmes, avec x entre zéro et pi sur deux, alors sinus carré égale un moins neuf vingt-cinquièmes, soit seize vingt-cinquièmes. Le sinus est positif ici, donc il vaut quatre cinquièmes." },
    { type: "quiz", q: "cos(−π/3) = ?", options: ["1/2", "−1/2", "√3/2", "−√3/2"], answer: 0, explain: "cos(−x) = cos x, donc cos(−π/3) = cos(π/3) = 1/2.", say: "À toi : combien vaut cosinus de moins pi sur trois ?" },
    { type: "recap", points: ["M(cos x ; sin x) sur le cercle", "cos²x + sin²x = 1", "cos est paire, sin est impaire"], say: "À retenir : le cosinus en abscisse, le sinus en ordonnée, et cosinus carré plus sinus carré égale un." },
  ]},
  "n1-ps": { notion: "n1-ps", title: "Le produit scalaire", scenes: [
    { type: "title", title: "Le produit scalaire", sub: "Première · Produit scalaire", say: "Deux vecteurs, un nombre. Le produit scalaire mesure si deux vecteurs vont dans le même sens, et surtout s'ils sont orthogonaux." },
    { type: "say", heading: "Deux façons de le calculer", lines: ["u · v = xx' + yy' (repère orthonormé)", "u · v = ‖u‖ × ‖v‖ × cos(u, v)", "on choisit selon ce qu'on connaît"], hl: 0, say: "Avec les coordonnées : x x prime plus y y prime. Avec les normes et l'angle : norme de u, fois norme de v, fois cosinus de l'angle. Choisis la formule selon ce que tu connais." },
    { type: "steps", heading: "Avec les coordonnées", lines: ["u(2 ; 1) et v(−1 ; 2)", "u · v = 2 × (−1) + 1 × 2", "u · v = 0 : u et v sont orthogonaux"], say: "Avec u deux, un et v moins un, deux : deux fois moins un, plus un fois deux, ça fait zéro. Un produit scalaire nul signifie que les vecteurs sont orthogonaux." },
    { type: "vectors", heading: "Un angle droit", points: { O: [0, 0], A: [2, 1], B: [-1, 2] }, arrows: [["O", "A"], ["O", "B", "red"]], say: "Et sur le dessin, on voit bien l'angle droit entre les deux vecteurs." },
    { type: "steps", heading: "Avec l'angle", lines: ["‖u‖ = 3, ‖v‖ = 4, angle de 60°", "u · v = 3 × 4 × cos 60°", "u · v = 12 × 1/2 = 6"], say: "Avec les normes et l'angle : trois fois quatre fois cosinus de soixante degrés, qui vaut un demi. Le produit scalaire vaut six." },
    { type: "quiz", q: "u(3 ; −2) et v(4 ; k) sont orthogonaux pour k =", options: ["6", "−6", "2/3", "−8"], answer: 0, explain: "3 × 4 + (−2) × k = 12 − 2k = 0, donc k = 6.", say: "À toi : pour quelle valeur de k les vecteurs trois, moins deux et quatre, k sont-ils orthogonaux ?" },
    { type: "recap", points: ["u · v = xx' + yy'", "u · v = ‖u‖‖v‖cos(u, v)", "u · v = 0 ⟺ u et v orthogonaux"], say: "À retenir : deux formules, et un produit scalaire nul signifie l'orthogonalité." },
  ]},
  "n1-geo-reperee": { notion: "n1-geo-reperee", title: "Droites et cercles", scenes: [
    { type: "title", title: "Droites et cercles", sub: "Première · Géométrie repérée", say: "Avec le produit scalaire, on écrit l'équation d'une droite à partir d'un vecteur normal, et celle d'un cercle à partir de son centre et de son rayon." },
    { type: "say", heading: "Vecteur normal", lines: ["n(a ; b) normal à la droite d", "d : ax + by + c = 0", "n(2 ; −1) : 2x − y + c = 0"], hl: 1, say: "Un vecteur normal est perpendiculaire à la droite. S'il a pour coordonnées a, b, la droite a une équation de la forme a x plus b y plus c égale zéro. Il reste à trouver c avec un point." },
    { type: "steps", heading: "Exemple", lines: ["n(2 ; −1) et A(1 ; 3) ∈ d", "2 × 1 − 3 + c = 0, donc c = 1", "d : 2x − y + 1 = 0"], say: "Avec n deux, moins un, et le point A un, trois : on remplace, deux moins trois plus c égale zéro, donc c égale un. La droite a pour équation deux x moins y plus un égale zéro." },
    { type: "graph", heading: "Le cercle", xmin: -2.4, xmax: 4.4, ymin: -1.5, ymax: 3.5, formula: "(x − 1)² + (y − 1)² = 4", curves: [{ fn: "1+sqrt(4-(x-1)^2)", color: "blue" }, { fn: "1-sqrt(4-(x-1)^2)", color: "blue" }], points: [{ x: 1, y: 1, label: "Ω(1 ; 1)" }], say: "Le cercle de centre oméga un, un et de rayon deux, c'est l'ensemble des points à distance deux de oméga. Son équation : x moins un au carré, plus y moins un au carré, égale quatre." },
    { type: "steps", heading: "Reconnaître un cercle", lines: ["x² + y² − 4x + 2y − 4 = 0", "(x − 2)² − 4 + (y + 1)² − 1 − 4 = 0", "(x − 2)² + (y + 1)² = 9 : centre (2 ; −1), rayon 3"], say: "Devant une équation développée, on complète les carrés. On trouve x moins deux au carré, plus y plus un au carré, égale neuf : c'est le cercle de centre deux, moins un, et de rayon trois." },
    { type: "quiz", q: "Le cercle de centre (−3 ; 2) et de rayon 5 a pour équation :", options: ["(x + 3)² + (y − 2)² = 25", "(x − 3)² + (y + 2)² = 25", "(x + 3)² + (y − 2)² = 5", "(x − 3)² + (y − 2)² = 25"], answer: 0, explain: "(x − a)² + (y − b)² = r² avec a = −3, b = 2 et r = 5.", say: "À toi : quelle est l'équation du cercle de centre moins trois, deux et de rayon cinq ?" },
    { type: "recap", points: ["n(a ; b) normal : ax + by + c = 0", "Cercle : (x − a)² + (y − b)² = r²", "Compléter les carrés pour trouver centre et rayon"], say: "À retenir : un vecteur normal donne les coefficients a et b, et un cercle s'écrit avec son centre et le carré de son rayon." },
  ]},
  "n1-proba-totales": { notion: "n1-proba-totales", title: "Les probabilités totales", scenes: [
    { type: "title", title: "Les probabilités totales", sub: "Première · Probabilités", say: "Pour calculer la probabilité d'un événement qui peut arriver par plusieurs chemins, on additionne les chemins. L'arbre rend ça évident." },
    { type: "tree", heading: "Un arbre à deux étapes", branches: [{ label: "A", p: "0,3", children: [{ label: "B", p: "0,9" }, { label: "bar(B)", p: "0,1" }] }, { label: "bar(A)", p: "0,7", children: [{ label: "B", p: "0,2" }, { label: "bar(B)", p: "0,8" }] }], highlight: [[0, 0], [1, 0]], formula: "p(B) = 0,3 × 0,9 + 0,7 × 0,2 = 0,41", say: "Exemple : trente pour cent des élèves suivent l'option A. Parmi eux, quatre-vingt-dix pour cent réussissent ; parmi les autres, vingt pour cent. Deux chemins mènent à B : en passant par A, ou par A barre." },
    { type: "steps", heading: "Le calcul", lines: ["p(A ∩ B) = 0,3 × 0,9 = 0,27", "p(bar(A) ∩ B) = 0,7 × 0,2 = 0,14", "p(B) = 0,27 + 0,14 = 0,41"], say: "On multiplie le long de chaque chemin, puis on additionne les chemins qui mènent à B : zéro virgule vingt-sept plus zéro virgule quatorze, donc zéro virgule quarante et un." },
    { type: "say", heading: "La formule", lines: ["A et bar(A) forment une partition", "p(B) = p(A ∩ B) + p(bar(A) ∩ B)", "on additionne les chemins qui mènent à B"], hl: 1, say: "C'est la formule des probabilités totales. Comme A et A barre se partagent tous les cas, p de B égale p de A inter B, plus p de A barre inter B." },
    { type: "steps", heading: "Et dans l'autre sens", lines: ["p_B(A) = p(A ∩ B)/p(B)", "= 0,27/0,41", "≈ 0,66"], say: "En bonus : sachant qu'un élève a réussi, quelle est la probabilité qu'il ait suivi l'option A ? Zéro virgule vingt-sept sur zéro virgule quarante et un, environ zéro virgule soixante-six." },
    { type: "quiz", q: "p(A) = 0,4 ; p(B sachant A) = 0,5 ; p(B sachant non A) = 0,25. Alors p(B) =", options: ["0,35", "0,75", "0,2", "0,45"], answer: 0, explain: "0,4 × 0,5 + 0,6 × 0,25 = 0,2 + 0,15 = 0,35.", say: "À toi : p de A vaut zéro virgule quatre, p de B sachant A zéro virgule cinq, et p de B sachant non A zéro virgule vingt-cinq. Combien vaut p de B ?" },
    { type: "recap", points: ["On multiplie le long d'un chemin", "On additionne les chemins qui mènent à B", "p(B) = p(A ∩ B) + p(bar(A) ∩ B)"], say: "À retenir : multiplier le long des branches, et additionner les chemins." },
  ]},
  "n1-independance": { notion: "n1-independance", title: "Événements indépendants", scenes: [
    { type: "title", title: "Événements indépendants", sub: "Première · Probabilités", say: "Deux événements indépendants : savoir que l'un s'est produit ne change rien aux chances de l'autre. Et attention, ce n'est pas la même chose qu'incompatibles." },
    { type: "say", heading: "La définition", lines: ["A et B indépendants ⟺ p(A ∩ B) = p(A) × p(B)", "ce qui revient à p_A(B) = p(B)"], hl: 0, say: "A et B sont indépendants quand p de A inter B égale p de A fois p de B. Autrement dit, savoir que A est réalisé ne modifie pas la probabilité de B." },
    { type: "steps", heading: "Vérifier", lines: ["p(A) = 0,6, p(B) = 0,8 et p(A ∩ B) = 0,48", "p(A) × p(B) = 0,6 × 0,8 = 0,48", "égalité : A et B sont indépendants"], say: "Pour vérifier, on calcule le produit p de A fois p de B, et on le compare à p de A inter B. Zéro virgule six fois zéro virgule huit, zéro virgule quarante-huit : c'est égal, donc ils sont indépendants." },
    { type: "say", heading: "Le piège : incompatibles", lines: ["incompatibles : A ∩ B = ∅, donc p(A ∩ B) = 0", "si p(A) > 0 et p(B) > 0 : pas indépendants", "pile puis face : indépendants, pas incompatibles"], hl: 0, say: "Incompatibles veut dire qu'ils ne peuvent pas se produire ensemble. Si A et B sont incompatibles et de probabilités non nulles, ils ne sont surtout pas indépendants : savoir que A s'est produit rend B impossible." },
    { type: "tree", heading: "Deux lancers d'une pièce", branches: [{ label: "P", p: "0,5", children: [{ label: "P", p: "0,5" }, { label: "F", p: "0,5" }] }, { label: "F", p: "0,5", children: [{ label: "P", p: "0,5" }, { label: "F", p: "0,5" }] }], highlight: [[0, 1]], formula: "p(P puis F) = 0,5 × 0,5 = 0,25", say: "Deux lancers d'une pièce sont indépendants : le deuxième ne dépend pas du premier. Dans l'arbre, les probabilités de la deuxième étape sont les mêmes sur chaque branche." },
    { type: "quiz", q: "A et B sont indépendants, p(A) = 0,3 et p(B) = 0,5. Alors p(A ∩ B) =", options: ["0,15", "0,8", "0", "0,2"], answer: 0, explain: "Indépendants : p(A ∩ B) = 0,3 × 0,5 = 0,15.", say: "À toi : A et B sont indépendants, avec p de A égale zéro virgule trois et p de B égale zéro virgule cinq. Combien vaut p de A inter B ?" },
    { type: "recap", points: ["Indépendants : p(A ∩ B) = p(A) × p(B)", "Incompatibles : p(A ∩ B) = 0", "Deux notions différentes"], say: "À retenir : indépendants, on multiplie. Incompatibles, l'intersection est vide. Ne les confonds jamais." },
  ]},
  "n1-va": { notion: "n1-va", title: "Variable aléatoire et espérance", scenes: [
    { type: "title", title: "Variable aléatoire et espérance", sub: "Première · Probabilités", say: "Un jeu vaut-il le coup ? Pour le savoir, on associe un gain à chaque issue, et on calcule le gain moyen : l'espérance." },
    { type: "say", heading: "Une variable aléatoire", lines: ["X associe un nombre à chaque issue", "dé : on gagne 5 € si on fait 6, sinon on perd 1 €", "X prend les valeurs 5 et −1"], hl: 0, say: "Une variable aléatoire associe un nombre à chaque issue d'une expérience. Exemple : on lance un dé. Si on fait six, on gagne cinq euros ; sinon, on perd un euro." },
    { type: "say", heading: "La loi de X", lines: ["valeurs xᵢ :  −1  ;  5", "p(X = xᵢ) :  5/6  ;  1/6", "la somme des probabilités vaut 1"], hl: 1, say: "La loi de X donne chaque valeur avec sa probabilité : moins un avec la probabilité cinq sixièmes, cinq avec la probabilité un sixième. La somme des probabilités fait toujours un." },
    { type: "steps", heading: "L'espérance", lines: ["E(X) = Σ xᵢ × p(X = xᵢ)", "E(X) = −1 × 5/6 + 5 × 1/6", "E(X) = −5/6 + 5/6 = 0"], say: "L'espérance est la moyenne des valeurs, pondérée par leurs probabilités. Ici, moins cinq sixièmes plus cinq sixièmes : zéro. Le jeu est équitable : en moyenne, on ne gagne rien et on ne perd rien." },
    { type: "say", heading: "Interpréter", lines: ["E(X) > 0 : jeu favorable au joueur", "E(X) < 0 : jeu défavorable", "E(X) = 0 : jeu équitable"], hl: 0, say: "Si l'espérance est positive, le jeu est favorable au joueur sur un grand nombre de parties. Négative, il est défavorable. Nulle, il est équitable." },
    { type: "quiz", q: "X vaut −3 ou 2, chacun avec la probabilité 1/2. E(X) =", options: ["−0,5", "0,5", "−1", "2,5"], answer: 0, explain: "E(X) = −3 × 1/2 + 2 × 1/2 = −0,5.", say: "À toi : X vaut moins trois ou deux, avec la même probabilité. Combien vaut l'espérance ?" },
    { type: "recap", points: ["Loi : les valeurs xᵢ et leurs probabilités", "E(X) = Σ xᵢ × p(X = xᵢ)", "Signe de E(X) : jeu favorable ou non"], say: "À retenir : d'abord la loi, puis l'espérance, qui donne le gain moyen sur un grand nombre de parties." },
  ]},

  /* ======================= TERMINALE ======================= */
  "nt-recurrence": { notion: "nt-recurrence", title: "Le raisonnement par récurrence", scenes: [
    { type: "title", title: "La récurrence", sub: "Terminale · Suites", say: "Comment prouver qu'une propriété est vraie pour tous les entiers, alors qu'il y en a une infinité ? Avec un effet domino." },
    { type: "say", heading: "L'effet domino", lines: ["le premier domino tombe", "si un domino tombe, le suivant tombe", "alors tous les dominos tombent"], hl: 2, say: "Imagine une file infinie de dominos. Si le premier tombe, et si chaque domino qui tombe fait tomber le suivant, alors ils tombent tous. C'est exactement le principe de la récurrence." },
    { type: "say", heading: "Les trois étapes", lines: ["Initialisation : P(0) est vraie", "Hérédité : si P(n) est vraie, alors P(n + 1) l'est", "Conclusion : P(n) est vraie pour tout n"], hl: 1, say: "Trois étapes. L'initialisation : on vérifie la propriété au premier rang. L'hérédité : on suppose qu'elle est vraie à un rang n, et on montre qu'elle l'est au rang suivant. Puis on conclut." },
    { type: "steps", heading: "Exemple : 2ⁿ ≥ n + 1", lines: ["Initialisation : 2⁰ = 1 ≥ 0 + 1, vrai", "Hérédité : on suppose 2ⁿ ≥ n + 1", "2ⁿ⁺¹ = 2 × 2ⁿ ≥ 2(n + 1) = 2n + 2", "2n + 2 ≥ n + 2, donc 2ⁿ⁺¹ ≥ (n + 1) + 1"], say: "Montrons que deux puissance n est supérieur ou égal à n plus un. Au rang zéro, un est supérieur ou égal à un : c'est vrai. Supposons-le au rang n. Alors deux puissance n plus un, c'est deux fois deux puissance n, donc au moins deux n plus deux, qui dépasse n plus deux. La propriété est vraie au rang suivant." },
    { type: "say", heading: "Le piège", lines: ["l'hérédité seule ne suffit pas", "il faut toujours l'initialisation", "et utiliser l'hypothèse P(n) dans l'hérédité"], hl: 1, say: "Attention : sans initialisation, rien ne démarre. Et dans l'hérédité, tu dois utiliser l'hypothèse de récurrence, sinon ce n'est pas une récurrence." },
    { type: "quiz", q: "Dans une récurrence, l'hérédité consiste à :", options: ["montrer que P(n) vraie entraîne P(n + 1) vraie", "vérifier que P(0) est vraie", "vérifier P(n) pour quelques valeurs", "montrer P(n + 1) sans utiliser P(n)"], answer: 0, explain: "On suppose P(n) vraie (hypothèse de récurrence) et on en déduit P(n + 1).", say: "À toi : en quoi consiste l'étape d'hérédité ?" },
    { type: "recap", points: ["Initialisation : P(n₀) vraie", "Hérédité : P(n) ⟹ P(n + 1)", "Conclusion : vraie pour tout n ≥ n₀"], say: "À retenir : on initialise, on montre l'hérédité en utilisant l'hypothèse, et on conclut." },
  ]},
  "nt-limites-suites": { notion: "nt-limites-suites", title: "Limites de suites", scenes: [
    { type: "title", title: "Limites de suites", sub: "Terminale · Suites", say: "Vers quoi va une suite quand n devient très grand ? Quelques limites de référence et deux théorèmes suffisent dans la plupart des cas." },
    { type: "graph", heading: "Les suites géométriques", xmin: -0.5, xmax: 8, ymin: 0, ymax: 4, curves: [{ fn: "3*0.5^x", label: "3 × 0,5ⁿ" }, { fn: "0.3*1.5^x", label: "0,3 × 1,5ⁿ", color: "red" }], say: "Pour une suite géométrique de raison q : si q est entre moins un et un, q puissance n tend vers zéro. Si q dépasse un, q puissance n tend vers plus l'infini." },
    { type: "say", heading: "Limites de référence", lines: ["qⁿ → 0 si −1 < q < 1", "qⁿ → +∞ si q > 1", "1/n → 0 et n² → +∞"], hl: 0, say: "Retiens : q puissance n tend vers zéro quand q est entre moins un et un, et vers plus l'infini quand q dépasse un. Un sur n tend vers zéro, n carré vers plus l'infini." },
    { type: "steps", heading: "Une forme indéterminée", lines: ["uₙ = n² − 3n : forme « ∞ − ∞ »", "uₙ = n²(1 − 3/n)", "1 − 3/n → 1 et n² → +∞, donc uₙ → +∞"], say: "Parfois, on tombe sur une forme indéterminée, comme l'infini moins l'infini. On factorise par le terme dominant : n carré, fois un moins trois sur n. La parenthèse tend vers un, donc la suite tend vers plus l'infini." },
    { type: "say", heading: "Théorèmes de comparaison", lines: ["si uₙ ≥ vₙ et vₙ → +∞, alors uₙ → +∞", "gendarmes : vₙ ≤ uₙ ≤ wₙ avec vₙ, wₙ → ℓ", "alors uₙ → ℓ"], hl: 1, say: "Et quand le calcul direct ne marche pas, on compare. Si une suite est coincée entre deux suites qui ont la même limite, elle a aussi cette limite : c'est le théorème des gendarmes." },
    { type: "quiz", q: "La limite de uₙ = 5 × 0,8ⁿ est :", options: ["0", "5", "+∞", "4"], answer: 0, explain: "−1 < 0,8 < 1, donc 0,8ⁿ → 0, et 5 × 0 = 0.", say: "À toi : vers quoi tend cinq fois zéro virgule huit puissance n ?" },
    { type: "recap", points: ["qⁿ → 0 si −1 < q < 1 ; qⁿ → +∞ si q > 1", "Forme indéterminée : factoriser par le terme dominant", "Encadrement : théorème des gendarmes"], say: "À retenir : les limites de référence, la factorisation par le terme dominant, et les gendarmes pour encadrer." },
  ]},
  "nt-limites-fonctions": { notion: "nt-limites-fonctions", title: "Limites et asymptotes", scenes: [
    { type: "title", title: "Limites et asymptotes", sub: "Terminale · Fonctions", say: "Quand une courbe file vers l'infini ou se rapproche d'une droite sans jamais la toucher, ce sont les limites qui le décrivent." },
    { type: "graph", heading: "f(x) = 2 + 1/(x − 1)", xmin: -3, xmax: 5, ymin: -3, ymax: 7, curves: [{ fn: "2+1/(x-1)", label: "courbe de f" }, { fn: "2", label: "y = 2", color: "red" }], say: "Voici la courbe de deux plus un sur x moins un. Quand x devient très grand, un sur x moins un tend vers zéro, donc f de x se rapproche de deux. La droite y égale deux est une asymptote horizontale." },
    { type: "say", heading: "Asymptote horizontale", lines: ["f(x) → b quand x → +∞ (ou −∞)", "⟹ la droite y = b est asymptote horizontale", "ici : y = 2"], hl: 1, say: "Si f de x tend vers un nombre b en plus l'infini ou en moins l'infini, la droite horizontale y égale b est asymptote à la courbe." },
    { type: "say", heading: "Asymptote verticale", lines: ["f(x) → ±∞ quand x → a", "⟹ la droite x = a est asymptote verticale", "ici : x → 1 avec x > 1, 1/(x − 1) → +∞"], hl: 1, say: "Et si f de x part vers l'infini quand x s'approche d'une valeur a, la droite verticale x égale a est asymptote. Ici, quand x s'approche de un par la droite, x moins un est un tout petit nombre positif, et un sur ce nombre tend vers plus l'infini." },
    { type: "steps", heading: "Un quotient en +∞", lines: ["f(x) = (3x² + 1)/(x² − 5)", "= x²(3 + 1/x²) / (x²(1 − 5/x²))", "→ 3 : asymptote y = 3"], say: "En l'infini, pour un quotient de polynômes, on factorise par les termes de plus haut degré. Il reste trois plus un sur x carré, sur un moins cinq sur x carré, qui tend vers trois." },
    { type: "quiz", q: "Quand x tend vers 0 avec x < 0, 1/x tend vers :", options: ["−∞", "+∞", "0", "1"], answer: 0, explain: "1 divisé par un nombre négatif très proche de 0 est un très grand nombre négatif.", say: "À toi : vers quoi tend un sur x quand x s'approche de zéro par valeurs négatives ?" },
    { type: "recap", points: ["f(x) → b en ±∞ : asymptote y = b", "f(x) → ±∞ en a : asymptote x = a", "Quotient en ±∞ : factoriser par les plus hauts degrés"], say: "À retenir : une limite finie en l'infini donne une asymptote horizontale, et une limite infinie en un point donne une asymptote verticale." },
  ]},
  "nt-continuite": { notion: "nt-continuite", title: "Le théorème des valeurs intermédiaires", scenes: [
    { type: "title", title: "Continuité et TVI", sub: "Terminale · Fonctions", say: "Si une fonction passe d'une valeur négative à une valeur positive sans lever le crayon, elle s'annule forcément quelque part. C'est le théorème des valeurs intermédiaires." },
    { type: "graph", heading: "f(x) = x³ + x − 1", xmin: -0.5, xmax: 1.5, ymin: -2, ymax: 3, curves: [{ fn: "x^3+x-1", label: "courbe de f" }], points: [{ x: 0, y: -1, label: "f(0) = −1" }, { x: 1, y: 1, label: "f(1) = 1" }, { x: 0.6823, y: 0, label: "α" }], say: "f de zéro vaut moins un, f de un vaut un. La courbe passe d'en dessous à au-dessus de l'axe, sans saut, car f est continue. Elle coupe donc l'axe au moins une fois, en un nombre qu'on appelle alpha." },
    { type: "say", heading: "Le théorème", lines: ["f continue sur [a ; b]", "k compris entre f(a) et f(b)", "⟹ f(x) = k a au moins une solution dans [a ; b]"], hl: 2, say: "Si f est continue sur a, b, alors tout nombre k compris entre f de a et f de b est atteint au moins une fois." },
    { type: "say", heading: "Une seule solution ?", lines: ["si de plus f est strictement monotone,", "alors la solution est unique", "f'(x) = 3x² + 1 > 0 : f strictement croissante"], hl: 1, say: "Pour avoir une seule solution, il faut en plus que f soit strictement monotone. Ici, f prime de x égale trois x carré plus un, toujours positive : f est strictement croissante, donc alpha est unique." },
    { type: "steps", heading: "Encadrer α", lines: ["f(0,6) = −0,184 < 0", "f(0,7) = 0,043 > 0", "donc 0,6 < α < 0,7"], say: "Pour encadrer alpha, on calcule des valeurs. f de zéro virgule six est négatif, f de zéro virgule sept est positif. Donc alpha est compris entre zéro virgule six et zéro virgule sept." },
    { type: "quiz", q: "f est continue sur [1 ; 3], f(1) = 5 et f(3) = −2. Alors :", options: ["f(x) = 0 a au moins une solution dans [1 ; 3]", "f(x) = 0 n'a pas de solution", "f(2) = 0", "f est décroissante"], answer: 0, explain: "0 est compris entre −2 et 5, et f est continue : c'est le TVI.", say: "À toi : f est continue sur un, trois, avec f de un égale cinq et f de trois égale moins deux. Que peux-tu affirmer ?" },
    { type: "recap", points: ["Continue + changement de signe ⟹ au moins une solution", "Strictement monotone en plus ⟹ solution unique", "On encadre la solution par balayage"], say: "À retenir : la continuité pour l'existence, la stricte monotonie pour l'unicité, et un balayage pour encadrer." },
  ]},
  "nt-composee": { notion: "nt-composee", title: "Dériver une composée", scenes: [
    { type: "title", title: "Dériver une composée", sub: "Terminale · Fonctions", say: "e puissance deux x, racine de x carré plus un : des fonctions dans des fonctions. Une seule formule permet de toutes les dériver." },
    { type: "say", heading: "La formule", lines: ["(g ∘ u)' = u' × g'(u)", "on dérive la fonction intérieure,", "puis la fonction extérieure, évaluée en u"], hl: 0, say: "Pour dériver g de u de x, on multiplie la dérivée de l'intérieur, u prime, par la dérivée de l'extérieur, évaluée en u." },
    { type: "say", heading: "Les cas à connaître", lines: ["(e^u)' = u'e^u", "(√u)' = u'/(2√u)", "(uⁿ)' = nu'u^(n−1)"], hl: 0, say: "Les trois cas les plus fréquents : e puissance u se dérive en u prime e puissance u. Racine de u, en u prime sur deux racine de u. Et u puissance n, en n u prime u puissance n moins un." },
    { type: "steps", heading: "Avec l'exponentielle", lines: ["f(x) = e^(x² − 3x)", "u = x² − 3x et u' = 2x − 3", "f'(x) = (2x − 3)e^(x² − 3x)"], say: "Pour e puissance x carré moins trois x : l'intérieur u vaut x carré moins trois x, et sa dérivée deux x moins trois. Donc f prime égale deux x moins trois, fois e puissance x carré moins trois x." },
    { type: "steps", heading: "Avec une racine", lines: ["f(x) = √(x² + 1)", "u = x² + 1 et u' = 2x", "f'(x) = 2x/(2√(x² + 1)) = x/√(x² + 1)"], say: "Pour racine de x carré plus un : u prime vaut deux x, donc f prime égale deux x sur deux racine de x carré plus un, soit x sur racine de x carré plus un." },
    { type: "quiz", q: "La dérivée de f(x) = (3x + 1)⁴ est :", options: ["12(3x + 1)³", "4(3x + 1)³", "3(3x + 1)³", "12(3x + 1)⁴"], answer: 0, explain: "n u' u^(n−1) = 4 × 3 × (3x + 1)³ = 12(3x + 1)³.", say: "À toi : dérive trois x plus un, le tout puissance quatre." },
    { type: "recap", points: ["(g ∘ u)' = u' × g'(u)", "(e^u)' = u'e^u", "(√u)' = u'/(2√u)"], say: "À retenir : la dérivée de l'intérieur, fois la dérivée de l'extérieur. Et n'oublie jamais ce u prime." },
  ]},
  "nt-convexite": { notion: "nt-convexite", title: "La convexité", scenes: [
    { type: "title", title: "Convexité", sub: "Terminale · Fonctions", say: "Une courbe qui sourit ou qui fait la grimace : c'est la convexité. La dérivée seconde la détecte." },
    { type: "graph", heading: "Convexe ou concave", xmin: -2.5, xmax: 2.5, ymin: -3, ymax: 5, curves: [{ fn: "x^2", label: "convexe" }, { fn: "-x^2+2", label: "concave", color: "red" }], say: "Une fonction convexe a une courbe tournée vers le haut, comme x carré : elle est au-dessus de toutes ses tangentes. Une fonction concave est tournée vers le bas : elle est en dessous de ses tangentes." },
    { type: "say", heading: "Le critère", lines: ["f convexe sur I ⟺ f'' ≥ 0 sur I", "f concave sur I ⟺ f'' ≤ 0 sur I", "f'' : la dérivée de la dérivée"], hl: 0, say: "Pour le savoir par le calcul, on dérive deux fois. Si la dérivée seconde est positive, f est convexe ; si elle est négative, f est concave." },
    { type: "graph", heading: "Point d'inflexion", xmin: -2, xmax: 2, ymin: -3, ymax: 3, curves: [{ fn: "x^3", label: "y = x³" }], points: [{ x: 0, y: 0, label: "inflexion" }], say: "Pour x cube, la dérivée seconde vaut six x : négative avant zéro, positive après. La courbe passe de concave à convexe en zéro. Ce point s'appelle un point d'inflexion : la courbe y traverse sa tangente." },
    { type: "steps", heading: "Étudier f(x) = x³ − 3x²", lines: ["f'(x) = 3x² − 6x", "f''(x) = 6x − 6", "f'' < 0 si x < 1 et f'' > 0 si x > 1", "point d'inflexion en x = 1"], say: "Pour x cube moins trois x carré : f seconde égale six x moins six, qui change de signe en un. Concave avant, convexe après : il y a un point d'inflexion d'abscisse un." },
    { type: "quiz", q: "f''(x) = x² + 1. Alors f est :", options: ["convexe sur ℝ", "concave sur ℝ", "convexe puis concave", "on ne peut pas savoir"], answer: 0, explain: "x² + 1 > 0 pour tout x, donc f est convexe sur ℝ.", say: "À toi : si f seconde de x égale x carré plus un, que dire de la convexité de f ?" },
    { type: "recap", points: ["Convexe : f'' ≥ 0, courbe au-dessus des tangentes", "Concave : f'' ≤ 0", "Inflexion : f'' change de signe"], say: "À retenir : on regarde le signe de la dérivée seconde, et un changement de signe donne un point d'inflexion." },
  ]},
  "nt-ln": { notion: "nt-ln", title: "Le logarithme népérien", scenes: [
    { type: "title", title: "Le logarithme népérien", sub: "Terminale · Fonctions", say: "e puissance x égale cinq : comment trouver x ? Il faut la fonction qui défait l'exponentielle. C'est le logarithme népérien." },
    { type: "graph", heading: "ln, la réciproque de exp", xmin: -4, xmax: 6.9, ymin: -3, ymax: 5, formula: "ln(eˣ) = x et e^(ln x) = x", curves: [{ fn: "exp(x)", label: "y = eˣ" }, { fn: "ln(x)", label: "y = ln x", color: "red" }, { fn: "x", label: "y = x", color: "green" }], say: "Les courbes de l'exponentielle et du logarithme sont symétriques par rapport à la droite y égale x. Le logarithme n'est défini que pour x strictement positif, et il vaut zéro en un." },
    { type: "say", heading: "La définition", lines: ["pour x > 0 : y = ln x ⟺ x = eʸ", "ln 1 = 0 et ln e = 1", "ln(eˣ) = x et e^(ln x) = x"], hl: 0, say: "Pour x strictement positif, ln de x est le nombre dont l'exponentielle vaut x. Ainsi, ln de un égale zéro, et ln de e égale un." },
    { type: "say", heading: "Les règles de calcul", lines: ["ln(ab) = ln a + ln b", "ln(a/b) = ln a − ln b", "ln(aⁿ) = n ln a"], hl: 0, say: "Le logarithme transforme les produits en sommes : ln de a fois b égale ln de a plus ln de b. Et il transforme les puissances en produits : ln de a puissance n égale n ln de a." },
    { type: "steps", heading: "Résoudre 3 × 2ⁿ > 1000", lines: ["2ⁿ > 1000/3", "n ln 2 > ln(1000/3)", "n > ln(1000/3)/ln 2 ≈ 8,38", "donc n ≥ 9"], say: "Le logarithme sert à faire descendre un exposant. Pour trois fois deux puissance n supérieur à mille, on passe au logarithme : n ln deux supérieur à ln de mille tiers. On divise par ln deux, qui est positif : n dépasse environ huit virgule trente-huit, donc n vaut au moins neuf." },
    { type: "quiz", q: "La solution de eˣ = 7 est :", options: ["x = ln 7", "x = e⁷", "x = 7/e", "x = (ln 7)/e"], answer: 0, explain: "On applique ln aux deux membres : x = ln 7.", say: "À toi : quelle est la solution de e puissance x égale sept ?" },
    { type: "recap", points: ["ln : réciproque de exp, définie sur ]0 ; +∞[", "ln(ab) = ln a + ln b et ln(aⁿ) = n ln a", "(ln x)' = 1/x"], say: "À retenir : ln défait l'exponentielle, transforme les produits en sommes, et sa dérivée est un sur x." },
  ]},
  "nt-trigo": { notion: "nt-trigo", title: "Les fonctions sinus et cosinus", scenes: [
    { type: "title", title: "Les fonctions sinus et cosinus", sub: "Terminale · Fonctions", say: "Les vagues, les sons, les marées : tout ce qui se répète se décrit avec sinus et cosinus." },
    { type: "graph", heading: "Des courbes périodiques", xmin: -7, xmax: 7, ymin: -1.6, ymax: 1.6, curves: [{ fn: "sin(x)", label: "y = sin x" }, { fn: "cos(x)", label: "y = cos x", color: "red" }], say: "Voici les courbes de sinus et cosinus. Elles oscillent entre moins un et un, et se répètent tous les deux pi : on dit qu'elles sont deux pi périodiques." },
    { type: "say", heading: "Périodicité et parité", lines: ["sin(x + 2π) = sin x et cos(x + 2π) = cos x", "cos est paire : cos(−x) = cos x", "sin est impaire : sin(−x) = −sin x"], hl: 0, say: "Deux pi périodique signifie que décaler de deux pi ne change rien. Le cosinus est pair : sa courbe est symétrique par rapport à l'axe des ordonnées. Le sinus est impair : sa courbe est symétrique par rapport à l'origine." },
    { type: "say", heading: "Les dérivées", lines: ["sin' = cos", "cos' = −sin", "(sin(ax + b))' = a cos(ax + b)"], hl: 1, say: "Dériver le sinus donne le cosinus. Dériver le cosinus donne moins le sinus : attention au signe. Et avec la dérivée d'une composée, sinus de a x plus b se dérive en a cosinus de a x plus b." },
    { type: "steps", heading: "Exemple", lines: ["f(x) = sin(2x)", "f'(x) = 2cos(2x)", "la période de f est π"], say: "Pour sinus de deux x, la dérivée vaut deux cosinus de deux x. Et la courbe va deux fois plus vite : sa période est pi." },
    { type: "quiz", q: "La dérivée de f(x) = cos(3x) est :", options: ["−3sin(3x)", "3sin(3x)", "−sin(3x)", "3cos(3x)"], answer: 0, explain: "cos' = −sin, et la dérivée de 3x donne le facteur 3.", say: "À toi : quelle est la dérivée de cosinus de trois x ?" },
    { type: "recap", points: ["sin et cos sont 2π-périodiques", "cos est paire, sin est impaire", "sin' = cos et cos' = −sin"], say: "À retenir : périodiques, l'une paire et l'autre impaire, et les dérivées, avec le signe moins pour le cosinus." },
  ]},
  "nt-primitives": { notion: "nt-primitives", title: "Les primitives", scenes: [
    { type: "title", title: "Les primitives", sub: "Terminale · Calcul intégral", say: "Primitiver, c'est dériver à l'envers : on connaît la dérivée, et on cherche la fonction." },
    { type: "say", heading: "La définition", lines: ["F est une primitive de f si F' = f", "x³ est une primitive de 3x²", "x³ + 7 aussi !"], hl: 0, say: "F est une primitive de f si la dérivée de F est f. x cube est une primitive de trois x carré. Mais x cube plus sept aussi, puisque la dérivée d'une constante est nulle." },
    { type: "say", heading: "Une infinité de primitives", lines: ["si F est une primitive de f,", "les primitives de f sont les F + C, C réel", "une condition F(a) = b fixe C"], hl: 1, say: "Deux primitives d'une même fonction diffèrent d'une constante. Pour en choisir une, on utilise une condition, par exemple la valeur de F en un point." },
    { type: "steps", heading: "Le formulaire à l'envers", lines: ["xⁿ → x^(n+1)/(n + 1)", "1/x → ln x (pour x > 0)", "eˣ → eˣ ; cos x → sin x ; sin x → −cos x"], say: "On lit le tableau des dérivées à l'envers. x puissance n a pour primitive x puissance n plus un, sur n plus un. Un sur x a pour primitive ln x. Et l'exponentielle est sa propre primitive." },
    { type: "steps", heading: "Exemple avec une condition", lines: ["f(x) = 6x² − 4x + 1", "F(x) = 2x³ − 2x² + x + C", "F(1) = 3 ⟹ 2 − 2 + 1 + C = 3 ⟹ C = 2"], say: "Pour six x carré moins quatre x plus un : F de x égale deux x cube moins deux x carré plus x plus C. Si F de un doit valoir trois, on trouve C égale deux." },
    { type: "quiz", q: "Une primitive de f(x) = e^(2x) est :", options: ["½e^(2x)", "2e^(2x)", "e^(2x)", "e^(2x+1)"], answer: 0, explain: "La dérivée de ½e^(2x) est ½ × 2e^(2x) = e^(2x).", say: "À toi : donne une primitive de e puissance deux x." },
    { type: "recap", points: ["F' = f", "Les primitives : F + C", "On vérifie toujours en dérivant"], say: "À retenir : une primitive se vérifie en dérivant, et il y en a une infinité, à une constante près." },
  ]},
  "nt-equadiff": { notion: "nt-equadiff", title: "Équations différentielles", scenes: [
    { type: "title", title: "Équations différentielles", sub: "Terminale · Calcul intégral", say: "Une équation dont l'inconnue est une fonction : c'est une équation différentielle. Elle décrit tout ce qui grandit ou décroît proportionnellement à sa taille." },
    { type: "say", heading: "L'équation y' = ay", lines: ["l'inconnue est une fonction y", "solutions : y = Ce^(ax), C réel", "y' = 2y : y = Ce^(2x)"], hl: 1, say: "L'équation y prime égale a y signifie que la vitesse de variation est proportionnelle à la valeur. Ses solutions sont les fonctions C e puissance a x, où C est un réel quelconque." },

/* ---------- Expressions mathématiques (parseur sûr, sans eval) ---------- */
const FUNCS = { sqrt: Math.sqrt, exp: Math.exp, ln: Math.log, log: Math.log10, sin: Math.sin, cos: Math.cos, tan: Math.tan, abs: Math.abs };
function compileExpr(src) {
  const s = String(src || "").toLowerCase().replace(/\s+/g, "").replace(/\*\*/g, "^").replace(/[−–]/g, "-").replace(/×/g, "*").replace(/÷/g, "/").replace(/(\d),(\d)/g, "$1.$2").replace(/²/g, "^2").replace(/³/g, "^3").replace(/π/g, "pi");
  if (!s || s.length > 120) throw new Error("expression");
  const raw = s.match(/\d+(?:\.\d+)?|[a-z]+|[-+*/^()]/g);
  if (!raw || raw.join("") !== s) throw new Error("expression");
  const toks = [];
  const isVal = t => t && (/^\d/.test(t) || t === "x" || t === "pi" || t === "e" || t === ")");
  for (const t of raw) {
    const prev = toks[toks.length - 1];
    const startsVal = /^\d/.test(t) || /^[a-z]/.test(t) || t === "(";
    if (isVal(prev) && startsVal && !(/^\d/.test(t) && /^\d/.test(prev))) toks.push("*");
    if (/^[a-z]+$/.test(t) && !(t in FUNCS) && !["x", "pi", "e"].includes(t)) throw new Error("expression");
    toks.push(t);
  }
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  function expr() { let f = term(); while (peek() === "+" || peek() === "-") { const op = next(), a = f, b = term(); f = op === "+" ? x => a(x) + b(x) : x => a(x) - b(x); } return f; }
  function term() { let f = unary(); while (peek() === "*" || peek() === "/") { const op = next(), a = f, b = unary(); f = op === "*" ? x => a(x) * b(x) : x => a(x) / b(x); } return f; }
  function unary() { if (peek() === "-") { next(); const a = unary(); return x => -a(x); } if (peek() === "+") { next(); return unary(); } return power(); }
  function power() { const a = atom(); if (peek() === "^") { next(); const b = unary(); return x => Math.pow(a(x), b(x)); } return a; }
  function atom() {
    const t = next();
    if (t === undefined) throw new Error("expression");
    if (/^\d/.test(t)) { const v = parseFloat(t); return () => v; }
    if (t === "x") return x => x;
    if (t === "pi") return () => Math.PI;
    if (t === "e") return () => Math.E;
    if (t in FUNCS) { if (next() !== "(") throw new Error("expression"); const a = expr(); if (next() !== ")") throw new Error("expression"); const fn = FUNCS[t]; return x => fn(a(x)); }
    if (t === "(") { const a = expr(); if (next() !== ")") throw new Error("expression"); return a; }
    throw new Error("expression");
  }
  const f = expr();
  if (i !== toks.length) throw new Error("expression");
  f(1.234);
  return f;
}

/* ---------- Formules enrichies : vec(AB), bar(A), x^(n+1), p_A(B) ---------- */
function parseRich(str) {
  const s = String(str ?? ""); const runs = []; let buf = "", i = 0;
  const flush = () => { if (buf) { runs.push({ t: buf }); buf = ""; } };
  const group = (start) => { let depth = 1, j = start; while (j < s.length && depth) { if (s[j] === "(") depth++; else if (s[j] === ")") depth--; j++; } return [s.slice(start, j - 1), j]; };
  while (i < s.length) {
    if (s.startsWith("vec(", i) || s.startsWith("bar(", i)) { flush(); const kind = s.slice(i, i + 3); const [inner, j] = group(i + 4); runs.push({ t: inner, [kind]: true }); i = j; continue; }
    if ((s[i] === "^" || s[i] === "_") && s[i + 1] === "(") { flush(); const [inner, j] = group(i + 2); runs.push({ t: inner, [s[i] === "^" ? "sup" : "sub"]: true }); i = j; continue; }
    if ((s[i] === "^" || s[i] === "_") && /[A-Za-z0-9]/.test(s[i + 1] || "")) { flush(); runs.push({ t: s[i + 1], [s[i] === "^" ? "sup" : "sub"]: true }); i += 2; continue; }
    buf += s[i]; i++;
  }
  flush(); return runs;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function rich(str) {
  return parseRich(str).map(r => r.vec ? `<span class="vec">${esc(r.t)}</span>` : r.bar ? `<span class="bar">${esc(r.t)}</span>` : r.sup ? `<sup>${esc(r.t)}</sup>` : r.sub ? `<sub>${esc(r.t)}</sub>` : esc(r.t)).join("");
}
function plain(str) { return parseRich(str).map(r => r.t).join(""); }

/* ---------- Dessin sur le canvas ---------- */
const VW = 1280, VH = 720;
const FONT = { head: '"Bricolage Grotesque", "Segoe UI", sans-serif', body: '"Atkinson Hyperlegible", "Segoe UI", sans-serif', math: '"STIX Two Text", "Cambria Math", "Times New Roman", serif' };
let PAL = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  PAL = { paper: g("--v-paper"), grid: g("--v-grid"), margin: g("--v-margin"), ink: g("--v-ink"), title: g("--v-title"), text: g("--v-text"), hl: g("--v-hl"), green: g("--v-green"), muted: g("--v-muted"), shade: g("--v-shade") };
}

/* ---------- séances (planning de l'élève) ---------- */
function seancesDe(a) {
  const det = (SEANCES[NIV] || {})[a.id];
  return a.dates.map((iso, k) => {
    const sam = D(iso).getDay() === 6;
    const h = sam ? a.horaires.sam : a.horaires.sem;
    const t = det && det[k] ? det[k] : null;
    let titre = t ? t[0] : `Séance ${k + 1}`, ev = t ? t[1] : "";
    if (!t && k === 0) { titre = "Accueil et QCM d'intégration"; ev = "QCM d'intégration"; }
    if (!t && k === a.dates.length - 1) { titre = "Bilan et QCM de clôture"; ev = "QCM de clôture"; }
    return { n: k + 1, iso, debut: h[0], fin: h[1], titre, ev, interro: t && t[2] ? t[2] : "", action: a };
  });
}
const toutesSeances = () => ACTIONS.flatMap(seancesDe);
const prochaine = () => toutesSeances().find(s => s.iso >= TODAY) || null;
const statutAction = a => a.dates[a.dates.length - 1] < TODAY ? "finie" : a.dates[0] > TODAY ? "avenir" : "encours";

/* ---------- vidéos ---------- */
const PREP = {};
const scriptOf = vid => PREP[vid] || (PREP[vid] = prepareScript(VIDEOS[vid], VIDEOS[vid].title));
const NOTIONS = {};
for (const y in CATALOG) for (const c of CATALOG[y]) for (const it of c.items) NOTIONS[it[0]] = { id: it[0], t: it[1], e: it[2], x: it[3], vid: it[4], ch: c.ch, y, yearName: (YEARS.find(z => z.id === y) || {}).name };
const vidDuree = vid => { const s = scriptOf(vid); const sec = s.scenes.reduce((a, x) => a + sceneDuration(x), 0); return `${Math.max(1, Math.round(sec / 60))} min`; };
const vu = id => !!ST.vus[EL.code][id];
function playNotion(id) {
  const n = NOTIONS[id]; if (!n || !n.vid) return;
  Player.open(withVoice(scriptOf(n.vid), n.vid), { label: `${n.yearName} · ${n.ch}`, kind: "Vidéo explicative", onEnd: () => { ST.vus[EL.code][id] = true; save(); return 0; }, actions: [] });
  Player.onClose(() => render());
}

function chartNotes(list) {
  const W = 640, H = 220, L = 34, R = 14, T = 18, B = 30, P = 26;
  const xs = list.map((n, k) => L + P + (list.length === 1 ? (W - L - R - 2 * P) / 2 : k * (W - L - R - 2 * P) / (list.length - 1)));
  const y = v => T + (20 - v) * (H - T - B) / 20;
  const path = vals => vals.map((v, k) => v === null ? "" : `${k && vals[k - 1] !== null ? "L" : "M"}${xs[k].toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const me = list.map(n => nb(n.note)), cl = list.map(n => nb(n.moy));
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de mes notes comparées à la moyenne de la classe">
    ${[0, 5, 10, 15, 20].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join("")}
    ${list.map((n, k) => nb(n.min) !== null && nb(n.max) !== null ? `<line x1="${xs[k]}" x2="${xs[k]}" y1="${y(nb(n.min))}" y2="${y(nb(n.max))}" class="rng"/>` : "").join("")}
    <path d="${path(cl)}" class="ln-cl"/><path d="${path(me)}" class="ln-me"/>
    ${me.map((v, k) => v === null ? "" : `<circle cx="${xs[k]}" cy="${y(v)}" r="5" class="pt-me"><title>${esc(fshort(list[k].date))} : ${f1(v)}/20</title></circle><text x="${xs[k]}" y="${y(v) - 10}" class="lb" text-anchor="middle">${f1(v)}</text>`).join("")}
    ${list.map((n, k) => `<text x="${xs[k]}" y="${H - 8}" class="ax" text-anchor="middle">${esc(fshort(n.date))}</text>`).join("")}
  </svg><figcaption class="legend"><span><i class="lg-me"></i>Ma note</span><span><i class="lg-cl"></i>Moyenne de la classe</span><span><i class="lg-rg"></i>Min – max de la classe</span></figcaption></figure>`;
}

function vPlanning() {

function calAnnuel() {
  const byDate = {}; toutesSeances().forEach(s => { byDate[s.iso] = s; });
  const mois = [], fin = NIV === "tle" ? [2027, 6] : [2027, 2];
  for (let y = 2026, m = 7; ; ) { mois.push([y, m]); if (y === fin[0] && m === fin[1]) break; m++; if (m > 11) { m = 0; y++; } }
  const leg = [["sigmaup", "Sigma Up"], ["tr", "Tables rondes* (à venir)"], [ACTIONS[2].famille, ACTIONS[2].court === "SigmaBoost" ? "SigmaBoost" : ACTIONS[2].nom]];
  return `<div class="legend cal-leg">${leg.map(([f, l]) => `<span class="fam-${f}"><i></i>${esc(l)}</span>`).join("")}<span><i class="today-i"></i>Aujourd'hui</span></div>
  <div class="cal-grid">${mois.map(([y, m]) => {
    const first = new Date(y, m, 1, 12), nd = new Date(y, m + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
    let cells = ""; for (let k = 0; k < off; k++) cells += `<span></span>`;
    for (let d = 1; d <= nd; d++) {
      const iso = isoOf(new Date(y, m, d, 12)), s = byDate[iso], we = ((off + d - 1) % 7) >= 5;
      cells += s ? `<button class="cd on fam-${s.action.famille} ${iso === TODAY ? "today" : ""} ${iso < TODAY ? "past" : ""}" data-sess="${iso}" aria-label="${esc(fdateL(iso))} : ${esc(s.action.nom)}, séance ${s.n}">${d}</button>` : `<span class="cd ${we ? "we" : ""} ${iso === TODAY ? "today" : ""}">${d}</span>`;
    }
    return `<div class="cal"><p class="cal-t">${MOIS[m][0].toUpperCase() + MOIS[m].slice(1)} ${y}</p><div class="cal-h">${["L", "M", "M", "J", "V", "S", "D"].map(x => `<span>${x}</span>`).join("")}</div><div class="cal-d">${cells}</div></div>`;
  }).join("")}</div>
  <p class="muted small top-gap">* Action en distanciel. Touche une date colorée pour voir le contenu de la séance.</p>
  <div id="sess-detail" class="top-gap" aria-live="polite"></div>`;
}

/* Emploi du temps : semaine type saisie par l'élève + séances Sigma de la semaine affichée */
function lundi(iso) { const d = D(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); }
function edt() {
  SUB.semaine = SUB.semaine || lundi((prochaine() || { iso: TODAY }).iso);
  const L0 = SUB.semaine, jours = [...Array(7)].map((_, k) => { const d = D(L0); d.setDate(d.getDate() + k); return isoOf(d); });
  const H0 = 7, H1 = 22, px = 44;
  const sig = toutesSeances().filter(s => jours.includes(s.iso));
  const tot = t => S.edt.filter(e => e[4] === t).reduce((a, e) => a + Math.max(0, minutes(e[2]) - minutes(e[1])), 0) / 60;
  const tSig = sig.reduce((a, s) => a + (minutes(s.fin) - minutes(s.debut)), 0) / 60;
  const block = (j, deb, fin, t, cls, extra = "") => { const top = (minutes(deb) - H0 * 60) / 60 * px, h = Math.max(18, (minutes(fin) - minutes(deb)) / 60 * px); return `<div class="eb ${cls}" style="top:${top}px;height:${h}px" ${extra}><b>${esc(t)}</b><small>${hh(deb)} – ${hh(fin)}</small></div>`; };
  return `<div class="row-between wrap"><div class="weeknav"><button class="btn btn-sm btn-ghost" data-week="-7" aria-label="Semaine précédente">←</button><b>Semaine du ${esc(fdate(jours[0]))} au ${esc(fdate(jours[6]))}</b><button class="btn btn-sm btn-ghost" data-week="7" aria-label="Semaine suivante">→</button><button class="btn btn-sm btn-ghost" data-week="0">Cette semaine</button></div>
  <div class="legend"><span><i class="eb-cours"></i>Cours ${f1(tot("cours"))} h</span><span><i class="eb-perso"></i>Travail perso ${f1(tot("perso"))} h</span><span><i class="eb-autre"></i>Activités ${f1(tot("autre"))} h</span><span><i class="eb-sigma"></i>Sigma ${f1(tSig)} h</span></div></div>
  <div class="edt-wrap"><div class="edt" style="--px:${px}px">
    <div class="edt-hours">${[...Array(H1 - H0 + 1)].map((_, k) => `<span style="top:${k * px}px">${H0 + k}h</span>`).join("")}</div>
    ${jours.map((iso, j) => `<div class="edt-col ${iso === TODAY ? "today" : ""}"><p class="edt-day">${JOURS[D(iso).getDay()]} <b>${D(iso).getDate()}</b></p><div class="edt-body" style="height:${(H1 - H0) * px}px">
      ${S.edt.map((e, k) => e[0] === j ? block(j, e[1], e[2], e[3], "eb-" + e[4], `role="button" tabindex="0" data-edt-del="${k}" aria-label="${esc(e[3])}, ${hh(e[1])} à ${hh(e[2])} : supprimer"`) : "").join("")}
      ${sig.filter(s => s.iso === iso).map(s => block(j, s.debut, s.fin, `Sigma · S${s.n}`, "eb-sigma", `title="${esc(s.titre)}"`)).join("")}
    </div></div>`).join("")}
  </div></div>
  <form class="card edt-add top-gap" data-form="edt"><h3>Ajouter un créneau à ma semaine type</h3>

/* ---------- 🎯 Projection BAC ---------- */
const bv = k => nb(S.bac[k]);
function bacCalc(proj) {      // proj : null (notes actuelles) ou 1, 2, 3
  let coef = 0, pts = 0, cc = 0, ccPts = 0;
  BAC.epreuves.forEach(e => {
    const v = proj && e.proj ? bv(`p${proj}_${e.id}`) : bv(e.id);
    coef += e.coef;                 // comme dans le modèle : les coefficients des épreuves comptent toujours
    if (v !== null) pts += v * e.coef;
  });
  BAC.controle.forEach(c => { [["_1", c.c1], ["_t", c.ct]].forEach(([s, k]) => { const v = bv(c.id + s); if (k && v !== null) { cc += k; ccPts += v * k; } }); });
  coef += cc; pts += ccPts;
  const moy = coef ? pts / coef : null;
  let verdict = "BAC non obtenu, pas de rattrapages";
  if (moy !== null) { if (moy >= 16) verdict = "BAC obtenu mention Très Bien"; else if (moy >= 14) verdict = "BAC obtenu mention Bien"; else if (moy >= 12) verdict = "BAC obtenu mention Assez Bien"; else if (moy >= 10) verdict = "BAC obtenu, sans mention"; else if (moy >= 8) verdict = "BAC non obtenu, rattrapages"; }
  return { coef, pts, moy, verdict, cc };
}

    ${BAC.controle.map(c => `<tr><th scope="row">${esc(c.nom)}</th>${[["_1", c.c1, "Première"], ["_t", c.ct, "Terminale"]].map(([s, k, l]) => k ? `<td>${noteIn(c.id + s, c.nom + ", " + l)}</td><td class="tnum">${k}</td><td class="tnum" data-out="pts_${c.id}${s}">${bv(c.id + s) !== null ? f1(bv(c.id + s) * k) : "—"}</td>` : `<td class="na" colspan="3"></td>`).join("")}</tr>`).join("")}

function majBac() {
